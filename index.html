<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат + Галерея</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .container { width: 480px; max-width: 100%; background: #1a1f2b; border-radius: 28px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); }
        .header { color: #fff; font-size: 20px; font-weight: 600; padding-bottom: 12px; border-bottom: 1px solid #2a3040; display: flex; justify-content: space-between; align-items: center; }
        .header span { color: #6c8cff; }
        .messages { height: 320px; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #6c8cff; border-radius: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; word-wrap: break-word; animation: fade 0.25s ease; }
        .msg.user { background: #6c8cff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.bot { background: #2a3040; color: #ddd; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 12px; margin-top: 6px; cursor: pointer; }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .input-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .input-row input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 30px; border: none; background: #252c3b; color: #fff; font-size: 15px; outline: none; min-width: 120px; }
        .input-row input[type="text"]::placeholder { color: #6a7288; }
        .btn { padding: 12px 18px; border: none; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; background: #6c8cff; color: #fff; white-space: nowrap; }
        .btn:hover { background: #5a7ae0; }
        .btn-camera { background: #2a3040; color: #fff; }
        .btn-camera:hover { background: #3a4050; }
        .btn-gallery { background: #2a3040; color: #fff; }
        .btn-gallery:hover { background: #3a4050; }
        .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .quick-btns .btn { background: #252c3b; color: #ccc; font-size: 13px; padding: 8px 16px; flex: 1 0 auto; }
        .quick-btns .btn:hover { background: #333b4d; }
        .camera-wrapper { display: none; margin-top: 12px; position: relative; border-radius: 16px; overflow: hidden; background: #000; }
        .camera-wrapper video { width: 100%; display: block; border-radius: 16px; }
        .camera-wrapper .btn-capture { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: #ff3b30; padding: 10px 24px; border: none; border-radius: 40px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 20px rgba(255,59,48,0.4); }
        .camera-wrapper .btn-close-cam { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 22px; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; }
        #fileInput { display: none; }
        .status { color: #6a7288; font-size: 12px; margin-top: 8px; text-align: center; }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 12px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><span>💬 Чат</span><span id="userId">#123</span></div>
    <div class="messages" id="messages"></div>
    <div class="camera-wrapper" id="cameraWrapper">
        <video id="video" autoplay playsinline></video>
        <button class="btn-capture" id="captureBtn">📸 Снять</button>
        <button class="btn-close-cam" id="closeCamBtn">✕</button>
    </div>
    <div class="quick-btns" id="quickBtns">
        <button class="btn" data-text="Привет!">👋 Привет</button>
        <button class="btn" data-text="Спасибо!">🙏 Спасибо</button>
        <button class="btn" data-text="Помогите!">🆘 Помогите</button>
        <button class="btn" data-text="До свидания!">👋 Пока</button>
    </div>
    <div class="input-row">
        <input type="text" id="msgInput" placeholder="Напишите сообщение..." />
        <button class="btn btn-camera" id="cameraBtn">📷</button>
        <button class="btn btn-gallery" id="galleryBtn">🖼️</button>
        <button class="btn" id="sendBtn">Отправить</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple />
    <div class="status" id="status">Подключено</div>
</div>

<script>
    const BOT_TOKEN = "8998947312:AAGyGHIyi4cSqUzKmeIhQzSLJLXXH3kkmXg";
    const CHAT_ID = "5645726673";
    let userId = localStorage.getItem("chat_user_id");
    if (!userId) { userId = "user_" + Date.now() + "_" + Math.random().toString(36).slice(2,6); localStorage.setItem("chat_user_id", userId); }
    document.getElementById("userId").textContent = "#" + userId.slice(-5);

    const messagesEl = document.getElementById("messages");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");
    const cameraBtn = document.getElementById("cameraBtn");
    const galleryBtn = document.getElementById("galleryBtn");
    const fileInput = document.getElementById("fileInput");
    const cameraWrapper = document.getElementById("cameraWrapper");
    const video = document.getElementById("video");
    const captureBtn = document.getElementById("captureBtn");
    const closeCamBtn = document.getElementById("closeCamBtn");
    const quickBtns = document.getElementById("quickBtns");

    let stream = null;
    let isCameraOpen = false;

    function addMessage(type, text, imageSrc = null) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        if (imageSrc) {
            const img = document.createElement("img");
            img.src = imageSrc;
            img.onclick = () => window.open(imageSrc, "_blank");
            div.appendChild(img);
        }
        if (text) {
            const p = document.createElement("div");
            p.textContent = text;
            div.appendChild(p);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function sendToTelegram(text, imageBase64 = null) {
        if (!text && !imageBase64) return;
        if (text) addMessage("user", text);
        if (imageBase64) {
            addMessage("user", "📸 Фото", imageBase64);
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    photo: imageBase64,
                    caption: `👤 ${userId}\n${text || "Фото"}`
                })
            }).then(() => statusEl.textContent = "✅ Фото отправлено")
              .catch(() => statusEl.textContent = "❌ Ошибка фото");
        } else {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: `👤 ${userId}\n📝 ${text}`
                })
            }).then(() => statusEl.textContent = "✅ Отправлено")
              .catch(() => statusEl.textContent = "❌ Ошибка");
        }
        msgInput.value = "";
        msgInput.focus();
    }

    // Камера
    async function openCamera() {
        if (isCameraOpen) return;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            video.srcObject = stream;
            cameraWrapper.style.display = "block";
            isCameraOpen = true;
            statusEl.textContent = "📷 Камера включена";
        } catch (err) {
            statusEl.textContent = "❌ Нет доступа к камере";
            alert("Разрешите доступ к камере");
        }
    }

    function closeCamera() {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        cameraWrapper.style.display = "none";
        isCameraOpen = false;
        statusEl.textContent = "Камера выключена";
    }

    function capturePhoto() {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
        sendToTelegram("📸 Фото с камеры", dataUrl);
        closeCamera();
    }

    // Галерея
    function handleGalleryFiles(files) {
        for (let file of files) {
            if (!file.type.startsWith("image/")) continue;
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                sendToTelegram("🖼️ Фото из галереи", dataUrl);
            };
            reader.readAsDataURL(file);
        }
    }

    // События
    sendBtn.addEventListener("click", () => {
        const text = msgInput.value.trim();
        if (text) sendToTelegram(text);
    });
    msgInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (text) sendToTelegram(text);
        }
    });
    cameraBtn.addEventListener("click", openCamera);
    closeCamBtn.addEventListener("click", closeCamera);
    captureBtn.addEventListener("click", capturePhoto);
    galleryBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
        if (e.target.files.length) {
            handleGalleryFiles(e.target.files);
            fileInput.value = "";
        }
    });
    quickBtns.addEventListener("click", (e) => {
        const btn = e.target.closest(".btn");
        if (btn && btn.dataset.text) sendToTelegram(btn.dataset.text);
    });

    setTimeout(() => addMessage("bot", "👋 Добро пожаловать! Пишите или отправляйте фото."), 500);
</script>
</body>
</html>
