<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Bot Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #1a1a2e;
            padding: 12px 16px;
            border-bottom: 2px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            background: #2a2a4a;
        }
        #status.online {
            background: #00c853;
            color: #fff;
        }
        #groups-panel {
            background: #12121f;
            padding: 10px 16px;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 8px;
        }
        .group-btn {
            background: #1e1e32;
            border: 1px solid #2a2a4a;
            color: #b0b0d0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .group-btn:hover {
            background: #2a2a4a;
            border-color: #4a4a7a;
        }
        .group-btn.active {
            background: #2a2a6a;
            border-color: #7b2ffc;
            color: #fff;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
        }
        .message:active {
            transform: scale(0.98);
            opacity: 0.7;
        }
        .message.incoming {
            background: #1a1a2e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.outgoing {
            background: #2a2a6a;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message .meta {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
        .message .reply-indicator {
            font-size: 11px;
            color: #7b2ffc;
            margin-bottom: 4px;
            border-left: 2px solid #7b2ffc;
            padding-left: 8px;
            opacity: 0.7;
        }
        #reply-bar {
            display: none;
            background: #1a1a2e;
            padding: 6px 16px;
            border-top: 1px solid #2a2a4a;
            font-size: 12px;
            color: #7b2ffc;
            flex-shrink: 0;
            justify-content: space-between;
        }
        #reply-bar.show {
            display: flex;
        }
        #reply-bar .cancel {
            color: #ff4444;
            cursor: pointer;
            padding: 0 8px;
        }
        #input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #12121f;
            border-top: 1px solid #2a2a4a;
            flex-shrink: 0;
        }
        #message-input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid #2a2a4a;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        #message-input:focus {
            border-color: #7b2ffc;
        }
        #send-btn {
            padding: 10px 24px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        #send-btn:active {
            transform: scale(0.95);
        }
        #loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 13px;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            color: #b0b0d0;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }
        #context-menu {
            display: none;
            position: fixed;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 6px 0;
            min-width: 140px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        #context-menu .item {
            padding: 8px 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.1s;
        }
        #context-menu .item:hover {
            background: #2a2a4a;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🤖 Bot Manager</h1>
        <span id="status">● Offline</span>
    </div>
    <div id="groups-panel"></div>
    <div id="chat-container">
        <div id="loading">Загрузка чатов...</div>
    </div>
    <div id="reply-bar">
        <span>Ответ на: <span id="reply-text">...</span></span>
        <span class="cancel" id="cancel-reply">✕</span>
    </div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
    <div id="context-menu">
        <div class="item" id="ctx-reply">💬 Ответить</div>
    </div>
    <div id="toast" class="toast"></div>

    <script>
        // ================== CONFIG ==================
        const BOT_TOKEN = '8413201181:AAGUetUusFIsnKT9oS2haAZujYfs6Fm2klE';
        const USER_ID = '5645726673';
        const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

        // ================== STATE ==================
        let groups = [];
        let currentGroupId = null;
        let currentGroupTitle = 'Без названия';
        let messages = {};
        let replyTarget = null; // { message_id, text, from }
        let updateInterval = null;
        let isOnline = false;
        let offset = 0;

        // ================== DOM REFS ==================
        const chatContainer = document.getElementById('chat-container');
        const groupsPanel = document.getElementById('groups-panel');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        const replyBar = document.getElementById('reply-bar');
        const replyText = document.getElementById('reply-text');
        const cancelReply = document.getElementById('cancel-reply');
        const toast = document.getElementById('toast');
        const contextMenu = document.getElementById('context-menu');
        const ctxReply = document.getElementById('ctx-reply');

        // ================== TOAST ==================
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ================== API HELPERS ==================
        async function apiCall(method, params = {}) {
            try {
                const url = `${API_BASE}/${method}`;
                const form = new FormData();
                for (const [k, v] of Object.entries(params)) {
                    if (v !== undefined && v !== null) form.append(k, v);
                }
                const res = await fetch(url, { method: 'POST', body: form });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                console.error('[API]', e);
                return { ok: false, error: e.message };
            }
        }

        // ================== GROUPS ==================
        async function loadGroups() {
            const result = await apiCall('getChats', {});
            if (!result.ok) {
                // fallback: получаем обновления, чтобы вытащить чаты
                const updates = await apiCall('getUpdates', { offset: 0, timeout: 1 });
                if (updates.ok && updates.result) {
                    const chatIds = new Set();
                    for (const u of updates.result) {
                        if (u.message && u.message.chat) {
                            chatIds.add(u.message.chat.id);
                        }
                    }
                    // запрашиваем инфу по каждому чату
                    const loaded = [];
                    for (const id of chatIds) {
                        const info = await apiCall('getChat', { chat_id: id });
                        if (info.ok && info.result) {
                            const chat = info.result;
                            loaded.push({
                                id: chat.id,
                                title: chat.title || chat.username || 'Чат',
                                type: chat.type
                            });
                        }
                    }
                    groups = loaded;
                    renderGroups();
                    if (groups.length > 0 && !currentGroupId) {
                        selectGroup(groups[0].id);
                    }
                    showToast(`Загружено ${groups.length} чатов`);
                }
                return;
            }
            // если бы getChats работал, но его нет — используем getUpdates
            const updates = await apiCall('getUpdates', { offset: 0, timeout: 1 });
            if (updates.ok && updates.result) {
                const chatIds = new Map();
                for (const u of updates.result) {
                    if (u.message && u.message.chat) {
                        const c = u.message.chat;
                        if (!chatIds.has(c.id)) {
                            chatIds.set(c.id, { id: c.id, title: c.title || c.username || 'Чат', type: c.type });
                        }
                    }
                }
                groups = Array.from(chatIds.values());
                renderGroups();
                if (groups.length > 0 && !currentGroupId) {
                    selectGroup(groups[0].id);
                }
                showToast(`Загружено ${groups.length} чатов`);
            }
        }

        function renderGroups() {
            groupsPanel.innerHTML = '';
            if (groups.length === 0) {
                groupsPanel.innerHTML = '<span style="color:#666;font-size:13px;">Нет групп. Добавьте бота в группу.</span>';
                return;
            }
            for (const g of groups) {
                const btn = document.createElement('button');
                btn.className = 'group-btn' + (currentGroupId === g.id ? ' active' : '');
                btn.textContent = g.title;
                btn.dataset.id = g.id;
                btn.onclick = () => selectGroup(g.id);
                groupsPanel.appendChild(btn);
            }
        }

        function selectGroup(id) {
            currentGroupId = id;
            const g = groups.find(x => x.id === id);
            currentGroupTitle = g ? g.title : 'Чат';
            renderGroups();
            messages[currentGroupId] = messages[currentGroupId] || [];
            chatContainer.innerHTML = '';
            renderMessages(currentGroupId);
            offset = 0;
            fetchMessages(currentGroupId);
            // запускаем обновления
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                fetchMessages(currentGroupId);
            }, 3000);
            // статус
            isOnline = true;
            statusEl.textContent = '● Online';
            statusEl.className = 'online';
        }

        // ================== MESSAGES ==================
        async function fetchMessages(chatId) {
            if (!chatId) return;
            const result = await apiCall('getUpdates', { offset: offset + 1, timeout: 1 });
            if (!result.ok) return;
            const updates = result.result || [];
            let newMsgs = [];
            for (const u of updates) {
                if (u.message && u.message.chat && u.message.chat.id === chatId) {
                    const msg = u.message;
                    const isOut = msg.from && msg.from.id == USER_ID;
                    newMsgs.push({
                        id: msg.message_id,
                        text: msg.text || '(медиа/команда)',
                        from: msg.from ? msg.from.first_name : 'Unknown',
                        isOut: isOut,
                        date: msg.date,
                        reply_to_message: msg.reply_to_message ? {
                            text: msg.reply_to_message.text || '(сообщение)',
                            from: msg.reply_to_message.from ? msg.reply_to_message.from.first_name : 'Unknown'
                        } : null
                    });
                    if (u.update_id > offset) offset = u.update_id;
                }
            }
            if (newMsgs.length > 0) {
                if (!messages[chatId]) messages[chatId] = [];
                messages[chatId] = messages[chatId].concat(newMsgs);
                renderMessages(chatId);
                // скролл вниз
                setTimeout(() => {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, 50);
                // проверка на уведомления
                for (const m of newMsgs) {
                    if (!m.isOut) {
                        showToast(`Новое сообщение от ${m.from}`);
                    }
                }
            }
        }

        function renderMessages(chatId) {
            const msgs = messages[chatId] || [];
            if (msgs.length === 0) {
                chatContainer.innerHTML = '<div style="text-align:center;color:#666;padding:40px;">Нет сообщений</div>';
                return;
            }
            let html = '';
            for (const m of msgs) {
                const cls = m.isOut ? 'outgoing' : 'incoming';
                let replyHtml = '';
                if (m.reply_to_message) {
                    replyHtml = `<div class="reply-indicator">↳ ${m.reply_to_message.from}: ${m.reply_to_message.text}</div>`;
                }
                html += `
                    <div class="message ${cls}" data-id="${m.id}" data-text="${m.text.replace(/"/g, '&quot;')}" data-from="${m.from}">
                        ${replyHtml}
                        ${m.text}
                        <div class="meta">
                            <span>${m.from}</span>
                            <span>${new Date(m.date * 1000).toLocaleTimeString()}</span>
                        </div>
                    </div>
                `;
            }
            chatContainer.innerHTML = html;

            // клик по сообщению для ответа
            chatContainer.querySelectorAll('.message').forEach(el => {
                el.addEventListener('click', (e) => {
                    // если клик по reply-indicator — игнорируем
                    if (e.target.closest('.reply-indicator')) return;
                    const id = parseInt(el.dataset.id);
                    const text = el.dataset.text;
                    const from = el.dataset.from;
                    replyTarget = { message_id: id, text, from };
                    replyText.textContent = `${from}: ${text.substring(0, 40)}${text.length > 40 ? '...' : ''}`;
                    replyBar.classList.add('show');
                    messageInput.focus();
                });
                // долгий тач для контекстного меню
                let touchTimer = null;
                el.addEventListener('touchstart', (e) => {
                    touchTimer = setTimeout(() => {
                        const id = parseInt(el.dataset.id);
                        const text = el.dataset.text;
                        const from = el.dataset.from;
                        replyTarget = { message_id: id, text, from };
                        // показать контекстное меню
                        const touch = e.touches[0];
                        contextMenu.style.display = 'block';
                        contextMenu.style.left = touch.clientX + 'px';
                        contextMenu.style.top = touch.clientY + 'px';
                        // скрыть через 3с
                        clearTimeout(contextMenu._hide);
                        contextMenu._hide = setTimeout(() => {
                            contextMenu.style.display = 'none';
                        }, 3000);
                    }, 600);
                });
                el.addEventListener('touchend', () => clearTimeout(touchTimer));
                el.addEventListener('touchmove', () => clearTimeout(touchTimer));
            });
        }

        // ================== SEND MESSAGE ==================
        async function sendMessage() {
            if (!currentGroupId) {
                showToast('Выберите группу');
                return;
            }
            const text = messageInput.value.trim();
            if (!text) {
                showToast('Введите текст');
                return;
            }
            const params = {
                chat_id: currentGroupId,
                text: text
            };
            if (replyTarget) {
                params.reply_to_message_id = replyTarget.message_id;
            }
            const result = await apiCall('sendMessage', params);
            if (result.ok) {
                // добавляем сообщение локально
                const msg = {
                    id: result.result.message_id,
                    text: text,
                    from: 'Вы',
                    isOut: true,
                    date: Math.floor(Date.now() / 1000),
                    reply_to_message: replyTarget ? {
                        text: replyTarget.text,
                        from: replyTarget.from
                    } : null
                };
                if (!messages[currentGroupId]) messages[currentGroupId] = [];
                messages[currentGroupId].push(msg);
                renderMessages(currentGroupId);
                messageInput.value = '';
                if (replyTarget) {
                    replyTarget = null;
                    replyBar.classList.remove('show');
                }
                setTimeout(() => {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, 50);
                showToast('Отправлено ✅');
            } else {
                showToast('Ошибка: ' + (result.description || 'неизвестно'));
            }
        }

        // ================== EVENTS ==================
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        cancelReply.addEventListener('click', () => {
            replyTarget = null;
            replyBar.classList.remove('show');
        });
        // контекстное меню
        ctxReply.addEventListener('click', () => {
            if (replyTarget) {
                replyText.textContent = `${replyTarget.from}: ${replyTarget.text.substring(0, 40)}...`;
                replyBar.classList.add('show');
                messageInput.focus();
                contextMenu.style.display = 'none';
            }
        });
        document.addEventListener('click', () => {
            contextMenu.style.display = 'none';
        });

        // ================== KEEP ALIVE (Service Worker) ==================
        // Регистрируем Service Worker для работы в фоне
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => {
                console.log('SW registered');
            }).catch(() => {});
        }

        // ================== INIT ==================
        async function init() {
            statusEl.textContent = '● Loading...';
            await loadGroups();
            if (groups.length === 0) {
                chatContainer.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#666;">
                        <div style="font-size:48px;margin-bottom:16px;">🤖</div>
                        <div>Добавьте бота в группу</div>
                        <div style="font-size:12px;margin-top:8px;">ID: ${USER_ID}</div>
                        <div style="font-size:12px;color:#444;">Бот будет автоматически обнаружен</div>
                    </div>
                `;
            }
            statusEl.textContent = '● Online';
            statusEl.className = 'online';
            isOnline = true;
        }

        // ================== ПЕРИОДИЧЕСКАЯ ПРОВЕРКА НОВЫХ ГРУПП ==================
        setInterval(async () => {
            if (!currentGroupId) {
                await loadGroups();
            }
        }, 15000);

        // ================== ЗАПУСК ==================
        init();

        // ================== SW КОД (встроенный) ==================
        // Для простоты — создаём sw.js динамически, если его нет
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', () => self.skipWaiting());
                self.addEventListener('activate', () => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline', { status: 503 })));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(() => {
                console.log('SW registered from blob');
            }).catch(() => {});
        }

        console.log('🚀 DIMSTAT BOT MANAGER v3.0');
        console.log('💬 USER_ID:', USER_ID);
        console.log('🤖 BOT_TOKEN:', BOT_TOKEN);
    </script>
</body>
</html>
