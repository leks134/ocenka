<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Group Manager Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header h1 {
            font-size: 18px;
            background: linear-gradient(135deg, #0088cc, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online {
            background: #6bcb77;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #ff6b6b;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ГРУППЫ */
        .groups-section {
            margin-bottom: 20px;
        }

        .groups-section h3 {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .groups-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .group-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-btn:hover {
            background: rgba(0,210,255,0.1);
            border-color: #00d2ff;
            transform: translateY(-2px);
        }

        .group-btn.active {
            background: rgba(0,210,255,0.15);
            border-color: #00d2ff;
            box-shadow: 0 0 20px rgba(0,210,255,0.1);
        }

        .group-btn .badge {
            background: rgba(255,255,255,0.1);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            color: #888;
        }

        .group-btn .badge.unread {
            background: #ff6b6b;
            color: #fff;
            animation: pulse 1s infinite;
        }

        /* ЧАТ */
        .chat-container {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.outgoing {
            align-self: flex-end;
            background: linear-gradient(135deg, #0088cc, #00d2ff);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .message.incoming {
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            border-bottom-left-radius: 4px;
            color: #ddd;
            cursor: pointer;
            transition: background 0.2s ease;
            position: relative;
        }

        .message.incoming:hover {
            background: rgba(255,255,255,0.08);
        }

        .message.incoming.selected {
            background: rgba(0,210,255,0.15);
            border: 1px solid rgba(0,210,255,0.3);
        }

        .message .msg-meta {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        .message .msg-sender {
            font-size: 11px;
            color: #00d2ff;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .message .reply-indicator {
            font-size: 11px;
            color: #f7971e;
            margin-bottom: 4px;
            padding: 2px 8px;
            background: rgba(247,151,30,0.1);
            border-radius: 6px;
            border-left: 2px solid #f7971e;
        }

        /* Поле ввода */
        .chat-input-area {
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input-area input:focus {
            border-color: #00d2ff;
        }

        .chat-input-area input::placeholder {
            color: #555;
        }

        .chat-input-area .send-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #0088cc, #00d2ff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .chat-input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,210,255,0.3);
        }

        .chat-input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .reply-badge {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: rgba(247,151,30,0.15);
            border-radius: 8px;
            font-size: 12px;
            color: #f7971e;
            border-left: 2px solid #f7971e;
        }

        .reply-badge.show {
            display: flex;
        }

        .reply-badge .cancel-reply {
            cursor: pointer;
            color: #ff6b6b;
            font-weight: bold;
            margin-left: 4px;
        }

        /* Управление */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls button:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        .controls button.danger {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .controls button.danger:hover {
            background: rgba(255,107,107,0.1);
        }

        /* Модалка добавления группы */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-content h3 {
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #00d2ff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-actions .confirm {
            background: linear-gradient(135deg, #0088cc, #00d2ff);
            color: #fff;
        }

        .modal-actions .cancel {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* Уведомления */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            background: rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 2000;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: #6bcb77; }
        .toast.error { border-color: #ff6b6b; }
        .toast.info { border-color: #00d2ff; }

        /* Scrollbar для всего */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
                border-radius: 16px;
            }

            .chat-container {
                height: 350px;
            }

            .group-btn {
                font-size: 12px;
                padding: 6px 12px;
            }

            .message {
                font-size: 13px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>🤖 Group Bot</h1>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Подключение...</span>
            </div>
        </div>

        <!-- ГРУППЫ -->
        <div class="groups-section">
            <h3>📋 Группы</h3>
            <div class="groups-list" id="groupsList">
                <button class="group-btn" onclick="showAddGroupModal()">➕ Добавить</button>
            </div>
        </div>

        <!-- ЧАТ -->
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div style="text-align: center; color: #444; padding: 40px 20px; font-size: 14px;">
                    Выберите группу или добавьте новую<br>
                    <span style="font-size: 12px; color: #333;">Бот будет отправлять/получать сообщения</span>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="reply-badge" id="replyBadge">
                    <span>💬 Ответ на: <span id="replyText">...</span></span>
                    <span class="cancel-reply" onclick="cancelReply()">✕</span>
                </div>
                <input type="text" id="messageInput" placeholder="Введите сообщение..." 
                       onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- КНОПКИ УПРАВЛЕНИЯ -->
        <div class="controls">
            <button onclick="refreshGroups()">🔄 Обновить</button>
            <button onclick="clearChat()">🗑️ Очистить</button>
            <button class="danger" onclick="leaveGroup()">🚪 Выйти из группы</button>
            <button onclick="showAddGroupModal()">➕ Добавить группу</button>
        </div>
    </div>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ ГРУППЫ -->
    <div class="modal" id="addGroupModal">
        <div class="modal-content">
            <h3>➕ Добавить группу</h3>
            <input type="text" id="groupChatId" placeholder="ID группы (например: -1001234567890)">
            <input type="text" id="groupName" placeholder="Название группы (по желанию)">
            <div class="modal-actions">
                <button class="confirm" onclick="addGroup()">Добавить</button>
                <button class="cancel" onclick="closeModal('addGroupModal')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ТОСТ -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ============ КОНФИГУРАЦИЯ ============
        // ============================================================
        const BOT_TOKEN = '8998947312:AAGyGHIyi4cSqUzKmeIhQzSLJLXXH3kkmXg';
        const BOT_API_URL = `https://api.telegram.org/bot${BOT_TOKEN}`;
        const USER_ID = '5645726673';

        // ============================================================
        // ============ СОСТОЯНИЕ ============
        // ============================================================
        let state = {
            groups: [],
            currentGroup: null,
            messages: [],
            replyTo: null,
            updateId: 0,
            isPolling: false,
            processing: false
        };

        // ============================================================
        // ============ ЗАГРУЗКА/СОХРАНЕНИЕ ============
        // ============================================================
        function loadState() {
            try {
                const saved = localStorage.getItem('tg_bot_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    state.groups = data.groups || [];
                    state.currentGroup = data.currentGroup || null;
                    state.messages = data.messages || [];
                    state.updateId = data.updateId || 0;
                }
            } catch (e) {
                console.warn('Ошибка загрузки:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('tg_bot_state', JSON.stringify({
                    groups: state.groups,
                    currentGroup: state.currentGroup,
                    messages: state.messages,
                    updateId: state.updateId
                }));
            } catch (e) {
                console.warn('Ошибка сохранения:', e);
            }
        }

        // ============================================================
        // ============ TELEGRAM API ============
        // ============================================================
        async function apiCall(method, data = {}) {
            try {
                const url = `${BOT_API_URL}/${method}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return { ok: false, error: error.message };
            }
        }

        async function sendMessageToGroup(chatId, text, replyToMessageId = null) {
            const data = {
                chat_id: chatId,
                text: text,
                parse_mode: 'HTML'
            };
            if (replyToMessageId) {
                data.reply_to_message_id = replyToMessageId;
            }
            const result = await apiCall('sendMessage', data);
            if (result.ok) {
                showToast('✅ Сообщение отправлено', 'success');
                return result.result;
            } else {
                showToast('❌ Ошибка: ' + (result.description || 'Неизвестная ошибка'), 'error');
                return null;
            }
        }

        async function getUpdates(offset = 0) {
            const result = await apiCall('getUpdates', {
                offset: offset,
                timeout: 30,
                allowed_updates: ['message']
            });
            return result;
        }

        async function getChat(chatId) {
            const result = await apiCall('getChat', { chat_id: chatId });
            return result;
        }

        async function leaveChat(chatId) {
            const result = await apiCall('leaveChat', { chat_id: chatId });
            return result;
        }

        async function getMe() {
            const result = await apiCall('getMe');
            return result;
        }

        // ============================================================
        // ============ ПОЛЛИНГ СООБЩЕНИЙ ============
        // ============================================================
        let pollingInterval = null;
        let isPollingActive = false;

        async function startPolling() {
            if (isPollingActive) return;
            isPollingActive = true;
            updateStatus(true);

            // Проверяем бота
            const me = await getMe();
            if (!me.ok) {
                showToast('❌ Бот не доступен. Проверьте токен.', 'error');
                isPollingActive = false;
                updateStatus(false);
                return;
            }
            console.log('✅ Бот запущен:', me.result.username);

            // Запускаем цикл поллинга
            pollingLoop();
        }

        async function pollingLoop() {
            if (!isPollingActive) return;

            try {
                const result = await getUpdates(state.updateId + 1);
                
                if (result.ok && result.result.length > 0) {
                    for (const update of result.result) {
                        state.updateId = update.update_id;
                        await processUpdate(update);
                    }
                    saveState();
                }

                // Обновляем UI
                updateUI();

            } catch (error) {
                console.error('Polling error:', error);
            }

            // Планируем следующий цикл
            if (isPollingActive) {
                setTimeout(pollingLoop, 2000);
            }
        }

        async function processUpdate(update) {
            if (!update.message) return;

            const msg = update.message;
            const chatId = String(msg.chat.id);

            // Проверяем, отслеживаем ли мы эту группу
            const group = state.groups.find(g => String(g.id) === chatId);
            if (!group) return;

            // Проверяем, не от бота ли сообщение
            if (msg.from && msg.from.id === (await getMe()).result.id) return;

            // Добавляем сообщение в историю
            const messageData = {
                id: msg.message_id,
                chatId: chatId,
                text: msg.text || msg.caption || '[Медиа]',
                from: msg.from ? {
                    id: msg.from.id,
                    username: msg.from.username || msg.from.first_name || 'Unknown'
                } : { id: 0, username: 'Unknown' },
                date: msg.date,
                isOutgoing: false,
                isReply: !!msg.reply_to_message,
                replyToId: msg.reply_to_message ? msg.reply_to_message.message_id : null
            };

            // Если это ответ на наше сообщение
            if (msg.reply_to_message) {
                const replyTo = msg.reply_to_message;
                // Проверяем, от бота ли сообщение
                const botInfo = await getMe();
                if (replyTo.from && replyTo.from.id === botInfo.result.id) {
                    messageData.isReplyToBot = true;
                    // Находим исходное сообщение в истории
                    const original = state.messages.find(m => 
                        m.id === replyTo.message_id && m.chatId === chatId
                    );
                    if (original) {
                        messageData.replyToText = original.text;
                    }
                }
            }

            state.messages.push(messageData);

            // Если это текущая группа - показываем уведомление
            if (String(state.currentGroup) === chatId) {
                showToast(`📩 ${messageData.from.username}: ${messageData.text.substring(0, 50)}`, 'info');
            } else {
                // Увеличиваем счетчик непрочитанных
                group.unread = (group.unread || 0) + 1;
                showToast(`📩 Новое сообщение в ${group.name || group.id}`, 'info');
            }

            // Обновляем группы
            const groupIndex = state.groups.findIndex(g => String(g.id) === chatId);
            if (groupIndex !== -1) {
                state.groups[groupIndex].lastMessage = {
                    text: messageData.text,
                    from: messageData.from.username,
                    date: messageData.date
                };
            }

            saveState();
        }

        // ============================================================
        // ============ ОТПРАВКА СООБЩЕНИЙ ============
        // ============================================================
        async function sendMessage() {
            if (!state.currentGroup) {
                showToast('❌ Выберите группу', 'error');
                return;
            }

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            document.getElementById('sendBtn').disabled = true;

            try {
                const replyId = state.replyTo ? state.replyTo.id : null;
                const result = await sendMessageToGroup(state.currentGroup, text, replyId);

                if (result) {
                    // Добавляем сообщение в историю
                    state.messages.push({
                        id: result.message_id,
                        chatId: state.currentGroup,
                        text: text,
                        from: { id: 'bot', username: 'Вы (бот)' },
                        date: Math.floor(Date.now() / 1000),
                        isOutgoing: true,
                        replyToId: replyId
                    });

                    // Сбрасываем reply
                    cancelReply();
                    saveState();
                    updateUI();
                }
            } catch (error) {
                showToast('❌ Ошибка отправки', 'error');
            }

            document.getElementById('sendBtn').disabled = false;
            document.getElementById('messageInput').focus();
        }

        // ============================================================
        // ============ ГРУППЫ ============
        // ============================================================
        function showAddGroupModal() {
            document.getElementById('addGroupModal').classList.add('show');
            document.getElementById('groupChatId').focus();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function addGroup() {
            const chatId = document.getElementById('groupChatId').value.trim();
            const name = document.getElementById('groupName').value.trim() || chatId;

            if (!chatId) {
                showToast('❌ Введите ID группы', 'error');
                return;
            }

            // Проверяем группу
            const result = await getChat(chatId);
            if (!result.ok) {
                showToast('❌ Группа не найдена. Проверьте ID', 'error');
                return;
            }

            // Проверяем, не добавлена ли уже
            if (state.groups.find(g => String(g.id) === chatId)) {
                showToast('⚠️ Группа уже добавлена', 'info');
                closeModal('addGroupModal');
                return;
            }

            state.groups.push({
                id: chatId,
                name: name,
                title: result.result.title || name,
                unread: 0,
                lastMessage: null
            });

            closeModal('addGroupModal');
            document.getElementById('groupChatId').value = '';
            document.getElementById('groupName').value = '';

            // Выбираем группу
            selectGroup(chatId);
            saveState();
            updateUI();
            showToast(`✅ Группа "${name}" добавлена`, 'success');
        }

        function selectGroup(chatId) {
            state.currentGroup = chatId;
            state.replyTo = null;
            
            // Сбрасываем непрочитанные
            const group = state.groups.find(g => String(g.id) === chatId);
            if (group) group.unread = 0;

            // Фильтруем сообщения для этой группы
            const chatMessages = state.messages.filter(m => String(m.chatId) === chatId);
            renderMessages(chatMessages);

            saveState();
            updateUI();
            document.getElementById('messageInput').focus();
        }

        async function refreshGroups() {
            showToast('🔄 Обновление...', 'info');
            // Проверяем все группы
            for (const group of state.groups) {
                try {
                    const result = await getChat(group.id);
                    if (result.ok) {
                        group.title = result.result.title || group.name;
                    }
                } catch (e) {
                    console.warn('Не удалось обновить группу:', group.id);
                }
            }
            saveState();
            updateUI();
            showToast('✅ Обновлено', 'success');
        }

        async function leaveGroup() {
            if (!state.currentGroup) {
                showToast('❌ Выберите группу', 'error');
                return;
            }

            if (!confirm(`Выйти из группы "${getGroupName(state.currentGroup)}"?`)) return;

            const result = await leaveChat(state.currentGroup);
            if (result.ok) {
                state.groups = state.groups.filter(g => String(g.id) !== state.currentGroup);
                state.messages = state.messages.filter(m => String(m.chatId) !== state.currentGroup);
                state.currentGroup = state.groups.length > 0 ? state.groups[0].id : null;
                state.replyTo = null;
                saveState();
                updateUI();
                showToast('✅ Вы вышли из группы', 'success');
            } else {
                showToast('❌ Ошибка: ' + (result.description || 'Неизвестная ошибка'), 'error');
            }
        }

        function getGroupName(chatId) {
            const group = state.groups.find(g => String(g.id) === chatId);
            return group ? (group.title || group.name || group.id) : chatId;
        }

        // ============================================================
        // ============ ОТВЕТЫ ============
        // ============================================================
        function setReply(messageId) {
            const msg = state.messages.find(m => m.id === messageId && String(m.chatId) === state.currentGroup);
            if (!msg) return;

            state.replyTo = msg;
            
            const badge = document.getElementById('replyBadge');
            badge.classList.add('show');
            document.getElementById('replyText').textContent = msg.text.substring(0, 50) + (msg.text.length > 50 ? '...' : '');

            // Подсвечиваем сообщение
            document.querySelectorAll('.message.incoming').forEach(el => el.classList.remove('selected'));
            const msgEl = document.querySelector(`.message[data-id="${messageId}"]`);
            if (msgEl) msgEl.classList.add('selected');

            showToast('💬 Ответ на сообщение', 'info');
        }

        function cancelReply() {
            state.replyTo = null;
            document.getElementById('replyBadge').classList.remove('show');
            document.querySelectorAll('.message.incoming').forEach(el => el.classList.remove('selected'));
        }

        // ============================================================
        // ============ UI ============
        // ============================================================
        function updateUI() {
            // Группы
            const groupsList = document.getElementById('groupsList');
            groupsList.innerHTML = '';

            state.groups.forEach(group => {
                const btn = document.createElement('button');
                btn.className = `group-btn${String(state.currentGroup) === String(group.id) ? ' active' : ''}`;
                
                const unreadBadge = group.unread > 0 ? `<span class="badge unread">${group.unread}</span>` : '';
                btn.innerHTML = `
                    📱 ${group.title || group.name || group.id}
                    ${unreadBadge}
                `;
                btn.onclick = () => selectGroup(group.id);
                groupsList.appendChild(btn);
            });

            // Кнопка добавления
            const addBtn = document.createElement('button');
            addBtn.className = 'group-btn';
            addBtn.textContent = '➕ Добавить';
            addBtn.onclick = showAddGroupModal;
            groupsList.appendChild(addBtn);

            // Статус
            updateStatus(isPollingActive);

            // Кнопка отправки
            document.getElementById('sendBtn').disabled = !state.currentGroup;

            // Инпут
            document.getElementById('messageInput').placeholder = state.currentGroup ? 
                `Сообщение в ${getGroupName(state.currentGroup)}` : 
                'Выберите группу';
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: #444; padding: 40px 20px; font-size: 14px;">
                        Нет сообщений в этой группе<br>
                        <span style="font-size: 12px; color: #333;">Отправьте первое сообщение</span>
                    </div>
                `;
                return;
            }

            // Сортируем по дате
            const sorted = [...messages].sort((a, b) => (a.date || 0) - (b.date || 0));

            sorted.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.isOutgoing ? 'outgoing' : 'incoming'}`;
                div.dataset.id = msg.id;

                if (msg.isReply && msg.replyToText) {
                    const replyDiv = document.createElement('div');
                    replyDiv.className = 'reply-indicator';
                    replyDiv.textContent = `↩️ ${msg.replyToText.substring(0, 40)}...`;
                    div.appendChild(replyDiv);
                }

                if (!msg.isOutgoing) {
                    const sender = document.createElement('div');
                    sender.className = 'msg-sender';
                    sender.textContent = msg.from.username || 'Unknown';
                    div.appendChild(sender);
                }

                const text = document.createElement('div');
                text.textContent = msg.text || '[Пустое сообщение]';
                div.appendChild(text);

                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                const time = msg.date ? new Date(msg.date * 1000).toLocaleTimeString() : '--:--';
                meta.innerHTML = `
                    <span>${time}</span>
                    ${msg.isOutgoing ? '✅ Отправлено' : '👤 Получено'}
                `;
                div.appendChild(meta);

                // Клик для ответа (только входящие)
                if (!msg.isOutgoing) {
                    div.style.cursor = 'pointer';
                    div.onclick = () => setReply(msg.id);
                    div.title = 'Нажмите для ответа';
                }

                container.appendChild(div);
            });

            // Прокрутка вниз
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus(online) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (online) {
                dot.className = 'status-dot online';
                text.textContent = 'Онлайн';
            } else {
                dot.className = 'status-dot offline';
                text.textContent = 'Офлайн';
            }
        }

        function clearChat() {
            if (!state.currentGroup) return;
            if (!confirm('Очистить историю сообщений для этой группы?')) return;
            
            state.messages = state.messages.filter(m => String(m.chatId) !== state.currentGroup);
            renderMessages([]);
            saveState();
            showToast('🗑️ История очищена', 'info');
        }

        // ============================================================
        // ============ ТОСТЫ ============
        // ============================================================
        let toastTimeout = null;

        function showToast(text, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.className = `toast ${type} show`;
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // ============ ИНИЦИАЛИЗАЦИЯ ============
        // ============================================================
        async function init() {
            loadState();
            
            // Проверяем бота
            const me = await getMe();
            if (me.ok) {
                console.log('✅ Бот подключен:', me.result.username);
                showToast('🚀 Бот готов к работе', 'success');
                startPolling();
            } else {
                showToast('❌ Ошибка подключения к боту', 'error');
                updateStatus(false);
            }

            // Если есть группы - выбираем первую
            if (state.groups.length > 0 && state.currentGroup) {
                selectGroup(state.currentGroup);
            } else if (state.groups.length > 0) {
                selectGroup(state.groups[0].id);
            }

            updateUI();

            // Сохраняем состояние при выходе
            window.addEventListener('beforeunload', () => {
                saveState();
                isPollingActive = false;
            });
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', init);

        console.log('🤖 Group Bot Manager v1.0');
        console.log('📱 Бот токен:', BOT_TOKEN);
        console.log('👤 Ваш ID:', USER_ID);
    </script>

</body>
</html>
