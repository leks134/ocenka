<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход в группу</title>
    <style>
        body { font-family: Arial; padding: 40px; }
        input, button { padding: 12px; width: 300px; margin: 8px 0; }
    </style>
</head>
<body>
    <h2>Чтобы получить доступ к группе, введите ваш Telegram ID</h2>
    <p>Узнать ID: @userinfobot</p>
    <input type="text" id="tg_id" placeholder="Например, 5645726673">
    <button onclick="send()">Получить ссылку</button>
    <p id="status"></p>

    <script>
        const BOT_TOKEN = "8998947312:AAGyGHIyi4cSqUzKmeIhQzSLJLXXH3kkmXg";
        const GROUP_LINK = "https://t.me/+i59UKEsplSE0OTNi";
        const YOUR_ID = 5645726673; // твой ID – для логов

        async function send() {
            const chatId = document.getElementById("tg_id").value.trim();
            if (!chatId) return alert("Введите ID");

            const msg = `🔐 Ваша ссылка для вступления в группу:\n${GROUP_LINK}\n\nПосле вступления вы получите доступ к контенту.`;

            // 1. Отправляем сообщение пользователю
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: msg
                })
            });

            const data = await res.json();

            if (data.ok) {
                document.getElementById("status").innerText = "✅ Ссылка отправлена в Telegram! Проверьте личные сообщения.";
                
                // 2. Отправляем уведомление тебе (что кто-то запросил ссылку)
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: YOUR_ID,
                        text: `👤 Новый запрос:\nID: ${chatId}\nВремя: ${new Date().toLocaleString()}`
                    })
                });
            } else {
                document.getElementById("status").innerText = "❌ Ошибка: " + data.description;
            }
        }
    </script>
</body>
</html>
