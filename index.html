<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Bot Manager</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{background:#0a0a0f;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
        #header{background:#1a1a2e;padding:6px 12px;border-bottom:2px solid #2a2a4a;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:38px}
        #header h1{font-size:14px;font-weight:600;background:linear-gradient(90deg,#00d4ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        #status{font-size:9px;padding:2px 8px;border-radius:8px;background:#2a2a4a}
        #status.online{background:#00c853;color:#fff}
        #status.error{background:#d32f2f;color:#fff}
        #groups-panel{background:#12121f;padding:4px 8px;border-bottom:1px solid #2a2a4a;flex-shrink:0;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:3px;align-items:center;min-height:32px}
        .group-btn{background:#1e1e32;border:1px solid #2a2a4a;color:#b0b0d0;padding:3px 10px;border-radius:12px;cursor:pointer;font-size:10px;transition:0.2s;flex-shrink:0;white-space:nowrap}
        .group-btn:hover{background:#2a2a4a;border-color:#4a4a7a}
        .group-btn.active{background:#2a2a6a;border-color:#7b2ffc;color:#fff}
        #add-group-btn{background:#1a1a3a;border:1px dashed #4a4a7a;color:#7b7b9b;padding:3px 8px;border-radius:12px;cursor:pointer;font-size:10px;flex-shrink:0}
        #add-group-btn:hover{background:#2a2a4a;border-color:#7b2ffc;color:#b0b0d0}
        #chat-container{flex:1;overflow-y:auto;padding:8px;background:#0f0f1a;display:flex;flex-direction:column;gap:4px;min-height:0}
        .message-wrapper{display:flex;flex-direction:column;max-width:88%;margin:2px 0}
        .message-wrapper.incoming{align-self:flex-start}
        .message-wrapper.outgoing{align-self:flex-end}
        .message-row{display:flex;align-items:flex-end;gap:6px}
        .message-wrapper.incoming .message-row{flex-direction:row}
        .message-wrapper.outgoing .message-row{flex-direction:row-reverse}
        .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;border:2px solid #2a2a4a}
        .message-content{display:flex;flex-direction:column;max-width:100%}
        .message-name{font-size:10px;font-weight:600;color:#8b8b9b;margin-bottom:2px;padding-left:2px}
        .message-wrapper.outgoing .message-name{text-align:right;padding-right:2px;color:#7b2ffc}
        .message{border-radius:14px;padding:8px 12px;word-wrap:break-word;font-size:13px;line-height:1.4;cursor:pointer;transition:0.1s;position:relative}
        .message-wrapper.incoming .message{background:#1e1e32;border-bottom-left-radius:4px}
        .message-wrapper.outgoing .message{background:#2a2a6a;border-bottom-right-radius:4px}
        .message:active{transform:scale(0.97);opacity:0.7}
        .message .meta{font-size:9px;opacity:0.4;margin-top:4px;display:flex;justify-content:flex-end;gap:6px}
        .message .reply-indicator{font-size:10px;color:#7b2ffc;margin-bottom:4px;border-left:2px solid #7b2ffc;padding-left:8px;opacity:0.8;background:rgba(123,47,252,0.05);border-radius:0 4px 4px 0;padding:3px 8px}
        .message .reply-indicator .reply-from{color:#7b2ffc;font-weight:500}
        .message .reply-indicator .reply-text{color:#a0a0c0}
        .message .photo{max-width:100%;border-radius:6px;margin:4px 0;display:block;cursor:pointer;max-height:250px;object-fit:contain}
        .deleted-indicator{color:#666;font-style:italic;font-size:12px;opacity:0.5}
        .msg-time{font-size:9px;color:#666}
        .deleted-badge{color:#888;font-size:9px;margin-left:4px;background:#2a2a2a;padding:0 5px;border-radius:6px}
        #reply-bar{display:none;background:#1a1a2e;padding:4px 10px;border-top:1px solid #2a2a4a;font-size:11px;color:#7b2ffc;flex-shrink:0;justify-content:space-between;align-items:center}
        #reply-bar.show{display:flex}
        #reply-bar .reply-preview{display:flex;flex-direction:column;flex:1;overflow:hidden}
        #reply-bar .reply-preview .reply-from{color:#7b2ffc;font-weight:500;font-size:10px}
        #reply-bar .reply-preview .reply-text{color:#a0a0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
        #reply-bar .cancel{color:#ff4444;cursor:pointer;padding:0 6px;font-size:16px;font-weight:bold}
        #input-area{display:flex;gap:5px;padding:5px 8px;background:#12121f;border-top:1px solid #2a2a4a;flex-shrink:0}
        #message-input{flex:1;padding:7px 12px;border-radius:18px;border:1px solid #2a2a4a;background:#1a1a2e;color:#e0e0e0;font-size:13px;outline:none;transition:0.2s}
        #message-input:focus{border-color:#7b2ffc}
        #send-btn{padding:7px 16px;border-radius:18px;border:none;background:linear-gradient(90deg,#00d4ff,#7b2ffc);color:#fff;font-weight:600;cursor:pointer;transition:0.2s;font-size:12px}
        #send-btn:active{transform:scale(0.95)}
        #loading{text-align:center;padding:20px;color:#666;font-size:12px}
        .toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #2a2a4a;padding:4px 12px;border-radius:12px;font-size:11px;color:#b0b0d0;opacity:0;transition:0.3s;pointer-events:none;z-index:999;max-width:90%;text-align:center}
        .toast.show{opacity:1}
        #modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
        #modal.show{display:flex}
        #modal-content{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:16px;width:90%;max-width:340px}
        #modal-content h3{margin-bottom:8px;color:#b0b0d0;font-size:15px}
        #modal-content p{font-size:11px;color:#888;margin-bottom:6px}
        #modal-content input{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #2a2a4a;background:#12121f;color:#e0e0e0;font-size:13px;outline:none;margin-bottom:8px}
        #modal-content input:focus{border-color:#7b2ffc}
        #modal-buttons{display:flex;gap:5px;justify-content:flex-end}
        #modal-buttons button{padding:5px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:11px}
        #modal-cancel{background:#2a2a4a;color:#b0b0d0}
        #modal-confirm{background:linear-gradient(90deg,#00d4ff,#7b2ffc);color:#fff}
        #modal-confirm:active{transform:scale(0.95)}
        #context-menu{display:none;position:fixed;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:8px;padding:3px 0;min-width:90px;z-index:1001;box-shadow:0 4px 16px rgba(0,0,0,0.6)}
        #context-menu .item{padding:4px 12px;font-size:11px;cursor:pointer;transition:0.1s}
        #context-menu .item:hover{background:#2a2a4a}
        ::-webkit-scrollbar{width:3px}
        ::-webkit-scrollbar-track{background:#0f0f1a}
        ::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}
        .empty-state{text-align:center;padding:40px;color:#666;font-size:13px}
    </style>
</head>
<body>
    <div id="header">
        <h1>Bot Manager</h1>
        <span id="status">Offline</span>
    </div>
    <div id="groups-panel">
        <button id="add-group-btn">+ Add Group</button>
    </div>
    <div id="chat-container">
        <div id="loading">Loading...</div>
    </div>
    <div id="reply-bar">
        <div class="reply-preview">
            <span class="reply-from" id="reply-from">User:</span>
            <span class="reply-text" id="reply-text">...</span>
        </div>
        <span class="cancel" id="cancel-reply">×</span>
    </div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
    <div id="context-menu">
        <div class="item" id="ctx-reply">Reply</div>
        <div class="item" id="ctx-delete">Delete</div>
        <div class="item" id="ctx-copy">Copy</div>
    </div>
    <div id="toast" class="toast"></div>

    <div id="modal">
        <div id="modal-content">
            <h3>Add Group</h3>
            <p>Enter group ID. Bot must be admin.</p>
            <input type="text" id="modal-input" placeholder="-1001234567890" autocomplete="off">
            <div id="modal-buttons">
                <button id="modal-cancel">Cancel</button>
                <button id="modal-confirm">Add</button>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const BOT_TOKEN = '8413201181:AAGUetUusFIsnKT9oS2haAZujYfs6Fm2klE';
            const USER_ID = '5645726673';
            const API_BASE = 'https://api.telegram.org/bot' + BOT_TOKEN;
            const STORAGE_KEY = 'bot_manager_groups';
            const MSG_STORAGE_KEY = 'bot_manager_messages';
            const DELETED_KEY = 'bot_manager_deleted';

            let groups = [];
            let currentGroupId = null;
            let messages = {};
            let deletedMessages = {};
            let replyTarget = null;
            let updateInterval = null;
            let offset = 0;

            const chatContainer = document.getElementById('chat-container');
            const groupsPanel = document.getElementById('groups-panel');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const statusEl = document.getElementById('status');
            const replyBar = document.getElementById('reply-bar');
            const replyFrom = document.getElementById('reply-from');
            const replyText = document.getElementById('reply-text');
            const cancelReply = document.getElementById('cancel-reply');
            const toast = document.getElementById('toast');
            const contextMenu = document.getElementById('context-menu');
            const ctxReply = document.getElementById('ctx-reply');
            const ctxDelete = document.getElementById('ctx-delete');
            const ctxCopy = document.getElementById('ctx-copy');
            const modal = document.getElementById('modal');
            const modalInput = document.getElementById('modal-input');
            const modalCancel = document.getElementById('modal-cancel');
            const modalConfirm = document.getElementById('modal-confirm');
            const addGroupBtn = document.getElementById('add-group-btn');

            let toastTimer = null;
            let currentContextMsg = null;

            function showToast(text) {
                toast.textContent = text;
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function(){
                    toast.classList.remove('show');
                }, 2500);
            }

            function setStatus(state, text) {
                statusEl.textContent = text || 'Offline';
                statusEl.className = '';
                if (state === 'online') statusEl.className = 'online';
                else if (state === 'error') statusEl.className = 'error';
            }

            function saveGroups() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(groups)); } catch(e) {}
            }
            function loadGroupsFromStorage() {
                try {
                    var data = localStorage.getItem(STORAGE_KEY);
                    if (data) { var parsed = JSON.parse(data); if (Array.isArray(parsed)) { groups = parsed; return true; } }
                } catch(e) {}
                return false;
            }
            function saveMessages() {
                try {
                    var data = {};
                    for (var key in messages) {
                        if (messages.hasOwnProperty(key)) {
                            data[key] = messages[key];
                        }
                    }
                    localStorage.setItem(MSG_STORAGE_KEY, JSON.stringify(data));
                } catch(e) {}
            }
            function loadMessagesFromStorage() {
                try {
                    var data = localStorage.getItem(MSG_STORAGE_KEY);
                    if (data) {
                        var parsed = JSON.parse(data);
                        for (var key in parsed) {
                            if (parsed.hasOwnProperty(key)) {
                                messages[key] = parsed[key];
                            }
                        }
                        return true;
                    }
                } catch(e) {}
                return false;
            }
            function saveDeleted() {
                try { localStorage.setItem(DELETED_KEY, JSON.stringify(deletedMessages)); } catch(e) {}
            }
            function loadDeletedFromStorage() {
                try {
                    var data = localStorage.getItem(DELETED_KEY);
                    if (data) {
                        var parsed = JSON.parse(data);
                        for (var key in parsed) {
                            if (parsed.hasOwnProperty(key)) {
                                deletedMessages[key] = parsed[key];
                            }
                        }
                        return true;
                    }
                } catch(e) {}
                return false;
            }
            function autoSave() {
                saveGroups();
                saveMessages();
                saveDeleted();
            }

            async function apiCall(method, params) {
                params = params || {};
                try {
                    var url = API_BASE + '/' + method;
                    var form = new FormData();
                    for (var k in params) {
                        if (params[k] !== undefined && params[k] !== null) {
                            form.append(k, params[k]);
                        }
                    }
                    var res = await fetch(url, { method: 'POST', body: form });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                } catch (e) {
                    console.error('[API]', e);
                    return { ok: false, error: e.message };
                }
            }

            async function getChatInfo(chatId) {
                return await apiCall('getChat', { chat_id: chatId });
            }

            async function getPhotoFile(fileId) {
                var result = await apiCall('getFile', { file_id: fileId });
                if (result.ok && result.result) {
                    return 'https://api.telegram.org/file/bot' + BOT_TOKEN + '/' + result.result.file_path;
                }
                return null;
            }

            function stringToColor(str) {
                var hash = 0;
                for (var i = 0; i < str.length; i++) {
                    hash = str.charCodeAt(i) + ((hash << 5) - hash);
                }
                var hue = Math.abs(hash) % 360;
                return 'hsl(' + hue + ', 55%, 45%)';
            }

            function getInitials(name) {
                if (!name) return '?';
                var parts = name.trim().split(' ');
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                }
                return name.substring(0, 2).toUpperCase();
            }

            async function loadGroupsFromAPI() {
                try {
                    var updates = await apiCall('getUpdates', { offset: 0, timeout: 1 });
                    if (updates.ok && updates.result) {
                        var chatMap = new Map();
                        for (var i = 0; i < updates.result.length; i++) {
                            var u = updates.result[i];
                            if (u.message && u.message.chat) {
                                var c = u.message.chat;
                                if (c.type === 'group' || c.type === 'supergroup') {
                                    if (!chatMap.has(c.id)) {
                                        chatMap.set(c.id, {
                                            id: c.id,
                                            title: c.title || c.username || 'Group',
                                            type: c.type
                                        });
                                    }
                                }
                            }
                        }
                        var apiGroups = Array.from(chatMap.values());
                        var savedIds = {};
                        for (var j = 0; j < groups.length; j++) {
                            savedIds[groups[j].id] = true;
                        }
                        for (var k = 0; k < apiGroups.length; k++) {
                            var g = apiGroups[k];
                            if (!savedIds[g.id]) {
                                groups.push(g);
                            }
                        }
                        renderGroups();
                        autoSave();
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('Load groups API error:', e);
                    return false;
                }
            }

            async function loadGroups() {
                loadGroupsFromStorage();
                await loadGroupsFromAPI();
                renderGroups();
                if (groups.length > 0 && !currentGroupId) {
                    selectGroup(groups[0].id);
                } else if (groups.length === 0) {
                    chatContainer.innerHTML = '<div class="empty-state">No groups found</div>';
                }
                setStatus('online', 'Online');
            }

            function renderGroups() {
                var addBtn = document.getElementById('add-group-btn');
                groupsPanel.innerHTML = '';
                groupsPanel.appendChild(addBtn);
                for (var i = 0; i < groups.length; i++) {
                    var g = groups[i];
                    var btn = document.createElement('button');
                    btn.className = 'group-btn' + (currentGroupId === g.id ? ' active' : '');
                    btn.textContent = g.title;
                    btn.dataset.id = g.id;
                    (function(id){
                        btn.onclick = function(){ selectGroup(id); };
                    })(g.id);
                    groupsPanel.appendChild(btn);
                }
            }

            async function selectGroup(id) {
                if (updateInterval) {
                    clearInterval(updateInterval);
                    updateInterval = null;
                }
                currentGroupId = id;
                renderGroups();
                loadMessagesFromStorage();
                loadDeletedFromStorage();
                if (!messages[currentGroupId]) messages[currentGroupId] = [];
                if (!deletedMessages[currentGroupId]) deletedMessages[currentGroupId] = {};
                chatContainer.innerHTML = '<div id="loading">Loading...</div>';
                offset = 0;
                await fetchMessages(currentGroupId);
                renderMessages(currentGroupId);
                updateInterval = setInterval(function(){
                    fetchMessages(currentGroupId);
                }, 2500);
                setStatus('online', 'Online');
            }

            async function addGroupById(groupId) {
                if (!groupId) return false;
                var info = await getChatInfo(groupId);
                if (!info.ok) {
                    showToast('Group not found or bot not admin');
                    return false;
                }
                var chat = info.result;
                if (chat.type !== 'group' && chat.type !== 'supergroup') {
                    showToast('Not a group');
                    return false;
                }
                for (var i = 0; i < groups.length; i++) {
                    if (groups[i].id === chat.id) {
                        showToast('Already added');
                        return false;
                    }
                }
                groups.push({
                    id: chat.id,
                    title: chat.title || 'Group',
                    type: chat.type
                });
                renderGroups();
                autoSave();
                selectGroup(chat.id);
                showToast('Group added');
                return true;
            }

            async function fetchMessages(chatId) {
                if (!chatId) return;
                try {
                    var result = await apiCall('getUpdates', { offset: offset + 1, timeout: 1 });
                    if (!result.ok) return;
                    var updates = result.result || [];
                    var newMsgs = [];
                    for (var i = 0; i < updates.length; i++) {
                        var u = updates[i];
                        if (u.message && u.message.chat && u.message.chat.id === chatId) {
                            var msg = u.message;
                            var isOut = msg.from && msg.from.id == USER_ID;
                            var replyData = null;
                            if (msg.reply_to_message) {
                                var replyMsg = msg.reply_to_message;
                                replyData = {
                                    text: replyMsg.text || '(message)',
                                    from: replyMsg.from ? replyMsg.from.first_name : 'Unknown',
                                    isDeleted: false
                                };
                            }
                            var photoUrl = null;
                            if (msg.photo && msg.photo.length > 0) {
                                var photoSize = msg.photo[msg.photo.length - 1];
                                photoUrl = await getPhotoFile(photoSize.file_id);
                            }
                            newMsgs.push({
                                id: msg.message_id,
                                text: msg.text || null,
                                from: msg.from ? msg.from.first_name : 'Unknown',
                                isOut: isOut,
                                date: msg.date,
                                reply_to_message: replyData,
                                photo: photoUrl,
                                hasPhoto: !!photoUrl,
                                isDeleted: false
                            });
                            if (u.update_id > offset) offset = u.update_id;
                        }
                    }
                    if (newMsgs.length > 0) {
                        if (!messages[chatId]) messages[chatId] = [];
                        for (var j = 0; j < newMsgs.length; j++) {
                            var nm = newMsgs[j];
                            var exists = false;
                            for (var k = 0; k < messages[chatId].length; k++) {
                                if (messages[chatId][k].id === nm.id) { exists = true; break; }
                            }
                            if (!exists) {
                                messages[chatId].push(nm);
                            }
                        }
                        renderMessages(chatId);
                        autoSave();
                        setTimeout(function(){
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }, 50);
                    }
                } catch (e) {
                    console.error('Fetch error:', e);
                }
            }

            function renderMessages(chatId) {
                var msgs = messages[chatId] || [];
                var deleted = deletedMessages[chatId] || {};
                if (msgs.length === 0 && Object.keys(deleted).length === 0) {
                    chatContainer.innerHTML = '<div class="empty-state">No messages</div>';
                    return;
                }
                var html = '';
                var allMsgs = msgs.slice();
                for (var did in deleted) {
                    if (deleted.hasOwnProperty(did)) {
                        var found = false;
                        for (var i = 0; i < msgs.length; i++) {
                            if (msgs[i].id == did) { found = true; break; }
                        }
                        if (!found) {
                            allMsgs.push({
                                id: parseInt(did),
                                text: null,
                                from: deleted[did].from || 'Unknown',
                                isOut: false,
                                date: deleted[did].date || 0,
                                isDeleted: true,
                                deletedText: deleted[did].text || 'message'
                            });
                        }
                    }
                }
                allMsgs.sort(function(a, b){ return a.date - b.date; });

                for (var i = 0; i < allMsgs.length; i++) {
                    var m = allMsgs[i];
                    var isDeleted = m.isDeleted || (deleted[m.id] && !m.text);
                    var cls = m.isOut ? 'outgoing' : 'incoming';
                    var dateStr = new Date(m.date * 1000).toLocaleTimeString();
                    var name = m.isOut ? 'You' : m.from;
                    var initials = getInitials(name);
                    var color = stringToColor(name);
                    var avatarHtml = '<div class="avatar" style="background:' + color + ';">' + initials + '</div>';
                    
                    var replyHtml = '';
                    if (m.reply_to_message) {
                        var replyTextContent = m.reply_to_message.text || '(message)';
                        replyHtml = '<div class="reply-indicator"><span class="reply-from">↳ ' + m.reply_to_message.from + ':</span> <span class="reply-text">' + replyTextContent + '</span></div>';
                    }
                    
                    var contentHtml = '';
                    if (isDeleted) {
                        var deletedText = deleted[m.id] ? deleted[m.id].text : 'message';
                        contentHtml = '<span class="deleted-indicator">[deleted: ' + deletedText + ']</span>';
                    } else {
                        if (m.text) {
                            contentHtml += m.text;
                        }
                        if (m.photo) {
                            contentHtml += '<img src="' + m.photo + '" class="photo" onclick="window.open(\'' + m.photo + '\',\'_blank\')" onerror="this.style.display=\'none\'">';
                        }
                        if (!m.text && m.hasPhoto) {
                            contentHtml += '<span style="color:#888;">[Photo]</span>';
                        }
                        if (!m.text && !m.hasPhoto) {
                            contentHtml += '<span style="color:#888;">[Media]</span>';
                        }
                    }
                    
                    var deletedBadge = isDeleted ? ' <span class="deleted-badge">deleted</span>' : '';
                    
                    html += '<div class="message-wrapper ' + cls + '">';
                    html += '<div class="message-row">';
                    if (!m.isOut) {
                        html += avatarHtml;
                    }
                    html += '<div class="message-content">';
                    if (!m.isOut) {
                        html += '<div class="message-name">' + name + deletedBadge + '</div>';
                    } else {
                        html += '<div class="message-name">You' + deletedBadge + '</div>';
                    }
                    html += '<div class="message" data-id="' + m.id + '" data-text="' + (m.text || '').replace(/"/g, '&quot;') + '" data-from="' + name + '">';
                    html += replyHtml;
                    html += contentHtml;
                    html += '<div class="meta"><span class="msg-time">' + dateStr + '</span></div>';
                    html += '</div></div>';
                    if (m.isOut) {
                        html += avatarHtml;
                    }
                    html += '</div></div>';
                }
                chatContainer.innerHTML = html;

                var msgElements = chatContainer.querySelectorAll('.message');
                for (var j = 0; j < msgElements.length; j++) {
                    var el = msgElements[j];
                    (function(element){
                        element.addEventListener('click', function(e) {
                            if (e.target.closest('.reply-indicator') || e.target.closest('.photo')) return;
                            var id = parseInt(element.dataset.id);
                            var text = element.dataset.text;
                            var from = element.dataset.from;
                            var isDeleted = element.querySelector('.deleted-indicator') !== null;
                            if (!isDeleted && text) {
                                replyTarget = { message_id: id, text: text, from: from };
                                replyFrom.textContent = from + ':';
                                replyText.textContent = text.substring(0, 50) + (text.length > 50 ? '...' : '');
                                replyBar.classList.add('show');
                                messageInput.focus();
                            }
                        });
                        var touchTimer = null;
                        element.addEventListener('touchstart', function(e) {
                            touchTimer = setTimeout(function() {
                                var id = parseInt(element.dataset.id);
                                var text = element.dataset.text;
                                var from = element.dataset.from;
                                var isOut = element.closest('.message-wrapper').classList.contains('outgoing');
                                currentContextMsg = { id: id, text: text, from: from, isOut: isOut };
                                var touch = e.touches[0];
                                contextMenu.style.display = 'block';
                                var left = touch.clientX;
                                var top = touch.clientY;
                                if (left + 140 > window.innerWidth) left = window.innerWidth - 140;
                                if (top + 80 > window.innerHeight) top = window.innerHeight - 80;
                                contextMenu.style.left = left + 'px';
                                contextMenu.style.top = top + 'px';
                                if (contextMenu._hideTimer) clearTimeout(contextMenu._hideTimer);
                                contextMenu._hideTimer = setTimeout(function() {
                                    contextMenu.style.display = 'none';
                                }, 3000);
                            }, 500);
                        });
                        element.addEventListener('touchend', function() {
                            if (touchTimer) clearTimeout(touchTimer);
                        });
                        element.addEventListener('touchmove', function() {
                            if (touchTimer) clearTimeout(touchTimer);
                        });
                    })(el);
                }
            }

            async function sendMessage() {
                if (!currentGroupId) {
                    showToast('Select group');
                    return;
                }
                var text = messageInput.value.trim();
                if (!text) {
                    showToast('Enter message');
                    return;
                }
                var params = {
                    chat_id: currentGroupId,
                    text: text
                };
                if (replyTarget) {
                    params.reply_to_message_id = replyTarget.message_id;
                }
                var result = await apiCall('sendMessage', params);
                if (result.ok) {
                    var msg = {
                        id: result.result.message_id,
                        text: text,
                        from: 'You',
                        isOut: true,
                        date: Math.floor(Date.now() / 1000),
                        reply_to_message: replyTarget ? {
                            text: replyTarget.text,
                            from: replyTarget.from
                        } : null,
                        photo: null,
                        hasPhoto: false,
                        isDeleted: false
                    };
                    if (!messages[currentGroupId]) messages[currentGroupId] = [];
                    messages[currentGroupId].push(msg);
                    renderMessages(currentGroupId);
                    autoSave();
                    messageInput.value = '';
                    if (replyTarget) {
                        replyTarget = null;
                        replyBar.classList.remove('show');
                    }
                    setTimeout(function(){
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }, 50);
                    showToast('Sent');
                } else {
                    showToast('Error');
                }
            }

            async function deleteMessage(chatId, messageId) {
                if (!chatId || !messageId) return;
                var msgToDelete = null;
                if (messages[chatId]) {
                    for (var i = 0; i < messages[chatId].length; i++) {
                        if (messages[chatId][i].id === messageId) {
                            msgToDelete = messages[chatId][i];
                            break;
                        }
                    }
                }
                var result = await apiCall('deleteMessage', {
                    chat_id: chatId,
                    message_id: messageId
                });
                if (result.ok) {
                    showToast('Deleted');
                    if (msgToDelete) {
                        if (!deletedMessages[chatId]) deletedMessages[chatId] = {};
                        deletedMessages[chatId][messageId] = {
                            text: msgToDelete.text || '(message)',
                            from: msgToDelete.from,
                            date: msgToDelete.date || Math.floor(Date.now() / 1000)
                        };
                        var newMsgs = [];
                        for (var j = 0; j < messages[chatId].length; j++) {
                            if (messages[chatId][j].id !== messageId) {
                                newMsgs.push(messages[chatId][j]);
                            }
                        }
                        messages[chatId] = newMsgs;
                        renderMessages(chatId);
                        autoSave();
                    }
                } else {
                    showToast('Cannot delete');
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            cancelReply.addEventListener('click', function() {
                replyTarget = null;
                replyBar.classList.remove('show');
            });

            ctxReply.addEventListener('click', function() {
                if (currentContextMsg && currentContextMsg.text) {
                    replyTarget = { message_id: currentContextMsg.id, text: currentContextMsg.text, from: currentContextMsg.from };
                    replyFrom.textContent = currentContextMsg.from + ':';
                    replyText.textContent = currentContextMsg.text.substring(0, 50) + (currentContextMsg.text.length > 50 ? '...' : '');
                    replyBar.classList.add('show');
                    messageInput.focus();
                    contextMenu.style.display = 'none';
                }
            });

            ctxDelete.addEventListener('click', function() {
                if (currentContextMsg && currentGroupId) {
                    deleteMessage(currentGroupId, currentContextMsg.id);
                    contextMenu.style.display = 'none';
                }
            });

            ctxCopy.addEventListener('click', function() {
                if (currentContextMsg && currentContextMsg.text) {
                    navigator.clipboard.writeText(currentContextMsg.text).then(function() {
                        showToast('Copied');
                    }).catch(function() {
                        showToast('Copy failed');
                    });
                }
                contextMenu.style.display = 'none';
            });

            document.addEventListener('click', function() {
                contextMenu.style.display = 'none';
            });

            addGroupBtn.addEventListener('click', function() {
                modal.classList.add('show');
                modalInput.value = '';
                modalInput.focus();
            });
            modalCancel.addEventListener('click', function() {
                modal.classList.remove('show');
            });
            modalConfirm.addEventListener('click', function() {
                var id = modalInput.value.trim();
                if (!id) {
                    showToast('Enter group ID');
                    return;
                }
                modal.classList.remove('show');
                addGroupById(id);
            });
            modalInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') modalConfirm.click();
            });
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.classList.remove('show');
            });

            setInterval(autoSave, 10000);

            setInterval(function() {
                if (currentGroupId) {
                    apiCall('getMe', {}).then(function(r) {
                        if (!r.ok) {
                            setStatus('error', 'Reconnecting');
                        } else {
                            setStatus('online', 'Online');
                        }
                    });
                }
            }, 30000);

            async function init() {
                setStatus('', 'Loading...');
                loadGroupsFromStorage();
                loadMessagesFromStorage();
                loadDeletedFromStorage();
                await loadGroupsFromAPI();
                renderGroups();
                if (groups.length > 0 && !currentGroupId) {
                    selectGroup(groups[0].id);
                } else if (groups.length === 0) {
                    chatContainer.innerHTML = '<div class="empty-state">No groups found</div>';
                }
                setStatus('online', 'Online');
            }

            init();

            if ('serviceWorker' in navigator) {
                var swCode = 'self.addEventListener("install",function(){self.skipWaiting()});self.addEventListener("activate",function(){self.clients.claim()});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).catch(function(){return new Response("Offline",{status:503})}))});';
                try {
                    var blob = new Blob([swCode], { type: 'application/javascript' });
                    var swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).then(function() {
                        console.log('SW registered');
                    }).catch(function() {});
                } catch(e) {}
            }

            console.log('Bot Manager v3.0');
        })();
    </script>
</body>
</html>
