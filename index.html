<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Bot Manager</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{background:#0a0a0f;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
        #header{background:#1a1a2e;padding:8px 14px;border-bottom:2px solid #2a2a4a;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:44px}
        #header h1{font-size:16px;font-weight:600;background:linear-gradient(90deg,#00d4ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        #status{font-size:10px;padding:2px 10px;border-radius:10px;background:#2a2a4a}
        #status.online{background:#00c853;color:#fff}
        #status.error{background:#d32f2f;color:#fff}
        #groups-panel{background:#12121f;padding:6px 10px;border-bottom:1px solid #2a2a4a;flex-shrink:0;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;align-items:center;min-height:40px}
        .group-btn{background:#1e1e32;border:1px solid #2a2a4a;color:#b0b0d0;padding:4px 12px;border-radius:14px;cursor:pointer;font-size:11px;transition:0.2s;flex-shrink:0;white-space:nowrap}
        .group-btn:hover{background:#2a2a4a;border-color:#4a4a7a}
        .group-btn.active{background:#2a2a6a;border-color:#7b2ffc;color:#fff}
        #add-group-btn{background:#1a1a3a;border:1px dashed #4a4a7a;color:#7b7b9b;padding:4px 10px;border-radius:14px;cursor:pointer;font-size:11px;flex-shrink:0}
        #add-group-btn:hover{background:#2a2a4a;border-color:#7b2ffc;color:#b0b0d0}
        #chat-container{flex:1;overflow-y:auto;padding:10px;background:#0f0f1a;display:flex;flex-direction:column;gap:4px;min-height:0}
        .message{max-width:80%;padding:7px 11px;border-radius:12px;word-wrap:break-word;font-size:13px;line-height:1.4;position:relative;cursor:pointer;transition:0.1s;user-select:none}
        .message:active{transform:scale(0.97);opacity:0.7}
        .message.incoming{background:#1a1a2e;align-self:flex-start;border-bottom-left-radius:3px}
        .message.outgoing{background:#2a2a6a;align-self:flex-end;border-bottom-right-radius:3px}
        .message .meta{font-size:9px;opacity:0.5;margin-top:2px;display:flex;justify-content:space-between}
        .message .reply-indicator{font-size:10px;color:#7b2ffc;margin-bottom:2px;border-left:2px solid #7b2ffc;padding-left:6px;opacity:0.7}
        #reply-bar{display:none;background:#1a1a2e;padding:4px 10px;border-top:1px solid #2a2a4a;font-size:11px;color:#7b2ffc;flex-shrink:0;justify-content:space-between;align-items:center}
        #reply-bar.show{display:flex}
        #reply-bar .cancel{color:#ff4444;cursor:pointer;padding:0 6px;font-size:16px}
        #input-area{display:flex;gap:6px;padding:6px 10px;background:#12121f;border-top:1px solid #2a2a4a;flex-shrink:0}
        #message-input{flex:1;padding:7px 12px;border-radius:18px;border:1px solid #2a2a4a;background:#1a1a2e;color:#e0e0e0;font-size:13px;outline:none;transition:0.2s}
        #message-input:focus{border-color:#7b2ffc}
        #send-btn{padding:7px 16px;border-radius:18px;border:none;background:linear-gradient(90deg,#00d4ff,#7b2ffc);color:#fff;font-weight:600;cursor:pointer;transition:0.2s;font-size:13px}
        #send-btn:active{transform:scale(0.95)}
        #loading{text-align:center;padding:20px;color:#666;font-size:12px}
        .toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #2a2a4a;padding:5px 14px;border-radius:14px;font-size:12px;color:#b0b0d0;opacity:0;transition:0.3s;pointer-events:none;z-index:999;max-width:90%}
        .toast.show{opacity:1}
        #modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
        #modal.show{display:flex}
        #modal-content{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:14px;padding:20px;width:90%;max-width:360px}
        #modal-content h3{margin-bottom:10px;color:#b0b0d0;font-size:16px}
        #modal-content p{font-size:12px;color:#888;margin-bottom:8px}
        #modal-content input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid #2a2a4a;background:#12121f;color:#e0e0e0;font-size:14px;outline:none;margin-bottom:10px}
        #modal-content input:focus{border-color:#7b2ffc}
        #modal-buttons{display:flex;gap:6px;justify-content:flex-end}
        #modal-buttons button{padding:6px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:12px}
        #modal-cancel{background:#2a2a4a;color:#b0b0d0}
        #modal-confirm{background:linear-gradient(90deg,#00d4ff,#7b2ffc);color:#fff}
        #modal-confirm:active{transform:scale(0.95)}
        #context-menu{display:none;position:fixed;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:8px;padding:4px 0;min-width:100px;z-index:1001;box-shadow:0 4px 16px rgba(0,0,0,0.6)}
        #context-menu .item{padding:5px 14px;font-size:12px;cursor:pointer;transition:0.1s}
        #context-menu .item:hover{background:#2a2a4a}
        ::-webkit-scrollbar{width:3px}
        ::-webkit-scrollbar-track{background:#0f0f1a}
        ::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}
        .error-msg{color:#ff6b6b;font-size:12px;text-align:center;padding:10px}
    </style>
</head>
<body>
    <div id="header">
        <h1>Bot Manager</h1>
        <span id="status">Offline</span>
    </div>
    <div id="groups-panel">
        <button id="add-group-btn">+ Add Group</button>
    </div>
    <div id="chat-container">
        <div id="loading">Loading chats...</div>
    </div>
    <div id="reply-bar">
        <span>Reply to: <span id="reply-text">...</span></span>
        <span class="cancel" id="cancel-reply">×</span>
    </div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
    <div id="context-menu">
        <div class="item" id="ctx-reply">Reply</div>
        <div class="item" id="ctx-delete">Delete</div>
    </div>
    <div id="toast" class="toast"></div>

    <div id="modal">
        <div id="modal-content">
            <h3>Add Group</h3>
            <p>Enter group ID (number). Bot must be admin in this group.</p>
            <input type="text" id="modal-input" placeholder="Example: -1001234567890" autocomplete="off">
            <div id="modal-buttons">
                <button id="modal-cancel">Cancel</button>
                <button id="modal-confirm">Add</button>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const BOT_TOKEN = '8413201181:AAGUetUusFIsnKT9oS2haAZujYfs6Fm2klE';
            const USER_ID = '5645726673';
            const API_BASE = 'https://api.telegram.org/bot' + BOT_TOKEN;

            let groups = [];
            let currentGroupId = null;
            let currentGroupTitle = 'No name';
            let messages = {};
            let replyTarget = null;
            let updateInterval = null;
            let offset = 0;
            let isConnected = false;
            let reconnectAttempts = 0;
            let lastUpdateTime = 0;

            const chatContainer = document.getElementById('chat-container');
            const groupsPanel = document.getElementById('groups-panel');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const statusEl = document.getElementById('status');
            const replyBar = document.getElementById('reply-bar');
            const replyText = document.getElementById('reply-text');
            const cancelReply = document.getElementById('cancel-reply');
            const toast = document.getElementById('toast');
            const contextMenu = document.getElementById('context-menu');
            const ctxReply = document.getElementById('ctx-reply');
            const ctxDelete = document.getElementById('ctx-delete');
            const modal = document.getElementById('modal');
            const modalInput = document.getElementById('modal-input');
            const modalCancel = document.getElementById('modal-cancel');
            const modalConfirm = document.getElementById('modal-confirm');
            const addGroupBtn = document.getElementById('add-group-btn');

            let toastTimer = null;

            function showToast(text) {
                toast.textContent = text;
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function(){
                    toast.classList.remove('show');
                }, 3000);
            }

            function setStatus(state, text) {
                statusEl.textContent = text || 'Offline';
                statusEl.className = '';
                if (state === 'online') statusEl.className = 'online';
                else if (state === 'error') statusEl.className = 'error';
            }

            async function apiCall(method, params) {
                params = params || {};
                try {
                    const url = API_BASE + '/' + method;
                    const form = new FormData();
                    for (var k in params) {
                        if (params[k] !== undefined && params[k] !== null) {
                            form.append(k, params[k]);
                        }
                    }
                    var res = await fetch(url, { method: 'POST', body: form });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                } catch (e) {
                    console.error('[API]', e);
                    return { ok: false, error: e.message };
                }
            }

            async function getChatInfo(chatId) {
                return await apiCall('getChat', { chat_id: chatId });
            }

            async function loadGroups() {
                try {
                    var updates = await apiCall('getUpdates', { offset: 0, timeout: 1 });
                    if (updates.ok && updates.result) {
                        var chatMap = new Map();
                        for (var i = 0; i < updates.result.length; i++) {
                            var u = updates.result[i];
                            if (u.message && u.message.chat) {
                                var c = u.message.chat;
                                if (c.type === 'group' || c.type === 'supergroup') {
                                    if (!chatMap.has(c.id)) {
                                        chatMap.set(c.id, {
                                            id: c.id,
                                            title: c.title || c.username || 'Group',
                                            type: c.type
                                        });
                                    }
                                }
                            }
                        }
                        groups = Array.from(chatMap.values());
                        renderGroups();
                        if (groups.length > 0 && !currentGroupId) {
                            selectGroup(groups[0].id);
                        } else if (groups.length === 0) {
                            chatContainer.innerHTML = '<div style="text-align:center;padding:40px;color:#666;font-size:13px;">No groups found.<br>Add bot to a group as admin or click "+ Add Group"</div>';
                        }
                        setStatus('online', 'Online');
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('Load groups error:', e);
                    setStatus('error', 'Error');
                    return false;
                }
            }

            function renderGroups() {
                var addBtn = document.getElementById('add-group-btn');
                groupsPanel.innerHTML = '';
                groupsPanel.appendChild(addBtn);
                for (var i = 0; i < groups.length; i++) {
                    var g = groups[i];
                    var btn = document.createElement('button');
                    btn.className = 'group-btn' + (currentGroupId === g.id ? ' active' : '');
                    btn.textContent = g.title;
                    btn.dataset.id = g.id;
                    (function(id){
                        btn.onclick = function(){ selectGroup(id); };
                    })(g.id);
                    groupsPanel.appendChild(btn);
                }
            }

            async function selectGroup(id) {
                if (updateInterval) {
                    clearInterval(updateInterval);
                    updateInterval = null;
                }
                currentGroupId = id;
                var g = null;
                for (var i = 0; i < groups.length; i++) {
                    if (groups[i].id === id) { g = groups[i]; break; }
                }
                currentGroupTitle = g ? g.title : 'Chat';
                renderGroups();
                messages[currentGroupId] = messages[currentGroupId] || [];
                chatContainer.innerHTML = '<div id="loading">Loading messages...</div>';
                offset = 0;
                await fetchMessages(currentGroupId);
                updateInterval = setInterval(function(){
                    fetchMessages(currentGroupId);
                }, 2500);
                setStatus('online', 'Online');
                isConnected = true;
            }

            async function addGroupById(groupId) {
                if (!groupId) return false;
                var info = await getChatInfo(groupId);
                if (!info.ok) {
                    showToast('Group not found or bot is not admin');
                    return false;
                }
                var chat = info.result;
                if (chat.type !== 'group' && chat.type !== 'supergroup') {
                    showToast('This is not a group');
                    return false;
                }
                for (var i = 0; i < groups.length; i++) {
                    if (groups[i].id === chat.id) {
                        showToast('Group already added');
                        return false;
                    }
                }
                groups.push({
                    id: chat.id,
                    title: chat.title || 'Group',
                    type: chat.type
                });
                renderGroups();
                selectGroup(chat.id);
                showToast('Group "' + chat.title + '" added');
                return true;
            }

            async function fetchMessages(chatId) {
                if (!chatId) return;
                try {
                    var result = await apiCall('getUpdates', { offset: offset + 1, timeout: 1 });
                    if (!result.ok) {
                        if (result.error && result.error.indexOf('timeout') === -1) {
                            setStatus('error', 'Error');
                        }
                        return;
                    }
                    var updates = result.result || [];
                    var newMsgs = [];
                    for (var i = 0; i < updates.length; i++) {
                        var u = updates[i];
                        if (u.message && u.message.chat && u.message.chat.id === chatId) {
                            var msg = u.message;
                            var isOut = msg.from && msg.from.id == USER_ID;
                            var replyData = null;
                            if (msg.reply_to_message) {
                                replyData = {
                                    text: msg.reply_to_message.text || '(message)',
                                    from: msg.reply_to_message.from ? msg.reply_to_message.from.first_name : 'Unknown'
                                };
                            }
                            newMsgs.push({
                                id: msg.message_id,
                                text: msg.text || '(media/command)',
                                from: msg.from ? msg.from.first_name : 'Unknown',
                                isOut: isOut,
                                date: msg.date,
                                reply_to_message: replyData
                            });
                            if (u.update_id > offset) offset = u.update_id;
                        }
                    }
                    if (newMsgs.length > 0) {
                        if (!messages[chatId]) messages[chatId] = [];
                        messages[chatId] = messages[chatId].concat(newMsgs);
                        renderMessages(chatId);
                        setTimeout(function(){
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }, 50);
                        for (var j = 0; j < newMsgs.length; j++) {
                            var m = newMsgs[j];
                            if (!m.isOut) {
                                showToast(m.from + ': ' + m.text.substring(0, 30) + (m.text.length > 30 ? '...' : ''));
                            }
                        }
                    }
                    setStatus('online', 'Online');
                    lastUpdateTime = Date.now();
                } catch (e) {
                    console.error('Fetch error:', e);
                }
            }

            function renderMessages(chatId) {
                var msgs = messages[chatId] || [];
                if (msgs.length === 0) {
                    chatContainer.innerHTML = '<div style="text-align:center;color:#666;padding:30px;font-size:13px;">No messages</div>';
                    return;
                }
                var html = '';
                for (var i = 0; i < msgs.length; i++) {
                    var m = msgs[i];
                    var cls = m.isOut ? 'outgoing' : 'incoming';
                    var replyHtml = '';
                    if (m.reply_to_message) {
                        replyHtml = '<div class="reply-indicator">↳ ' + m.reply_to_message.from + ': ' + m.reply_to_message.text + '</div>';
                    }
                    var dateStr = new Date(m.date * 1000).toLocaleTimeString();
                    var safeText = m.text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                    html += '<div class="message ' + cls + '" data-id="' + m.id + '" data-text="' + safeText + '" data-from="' + m.from + '">';
                    html += replyHtml;
                    html += m.text;
                    html += '<div class="meta"><span>' + m.from + '</span><span>' + dateStr + '</span></div>';
                    html += '</div>';
                }
                chatContainer.innerHTML = html;

                var msgElements = chatContainer.querySelectorAll('.message');
                for (var k = 0; k < msgElements.length; k++) {
                    var el = msgElements[k];
                    (function(element){
                        element.addEventListener('click', function(e) {
                            if (e.target.closest('.reply-indicator')) return;
                            var id = parseInt(element.dataset.id);
                            var text = element.dataset.text;
                            var from = element.dataset.from;
                            replyTarget = { message_id: id, text: text, from: from };
                            replyText.textContent = from + ': ' + text.substring(0, 40) + (text.length > 40 ? '...' : '');
                            replyBar.classList.add('show');
                            messageInput.focus();
                        });
                        var touchTimer = null;
                        element.addEventListener('touchstart', function(e) {
                            touchTimer = setTimeout(function() {
                                var id = parseInt(element.dataset.id);
                                var text = element.dataset.text;
                                var from = element.dataset.from;
                                var isOut = element.classList.contains('outgoing');
                                replyTarget = { message_id: id, text: text, from: from, isOut: isOut };
                                var touch = e.touches[0];
                                contextMenu.style.display = 'block';
                                var left = touch.clientX;
                                var top = touch.clientY;
                                if (left + 140 > window.innerWidth) left = window.innerWidth - 140;
                                if (top + 60 > window.innerHeight) top = window.innerHeight - 60;
                                contextMenu.style.left = left + 'px';
                                contextMenu.style.top = top + 'px';
                                if (contextMenu._hideTimer) clearTimeout(contextMenu._hideTimer);
                                contextMenu._hideTimer = setTimeout(function() {
                                    contextMenu.style.display = 'none';
                                }, 3000);
                            }, 500);
                        });
                        element.addEventListener('touchend', function() {
                            if (touchTimer) clearTimeout(touchTimer);
                        });
                        element.addEventListener('touchmove', function() {
                            if (touchTimer) clearTimeout(touchTimer);
                        });
                    })(el);
                }
            }

            async function sendMessage() {
                if (!currentGroupId) {
                    showToast('Select a group first');
                    return;
                }
                var text = messageInput.value.trim();
                if (!text) {
                    showToast('Enter message');
                    return;
                }
                var params = {
                    chat_id: currentGroupId,
                    text: text
                };
                if (replyTarget) {
                    params.reply_to_message_id = replyTarget.message_id;
                }
                var result = await apiCall('sendMessage', params);
                if (result.ok) {
                    var msg = {
                        id: result.result.message_id,
                        text: text,
                        from: 'You',
                        isOut: true,
                        date: Math.floor(Date.now() / 1000),
                        reply_to_message: replyTarget ? {
                            text: replyTarget.text,
                            from: replyTarget.from
                        } : null
                    };
                    if (!messages[currentGroupId]) messages[currentGroupId] = [];
                    messages[currentGroupId].push(msg);
                    renderMessages(currentGroupId);
                    messageInput.value = '';
                    if (replyTarget) {
                        replyTarget = null;
                        replyBar.classList.remove('show');
                    }
                    setTimeout(function(){
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }, 50);
                    showToast('Sent');
                } else {
                    showToast('Error: ' + (result.description || 'unknown'));
                }
            }

            async function deleteMessage(chatId, messageId) {
                if (!chatId || !messageId) return;
                var result = await apiCall('deleteMessage', {
                    chat_id: chatId,
                    message_id: messageId
                });
                if (result.ok) {
                    showToast('Deleted');
                    if (messages[chatId]) {
                        var newMsgs = [];
                        for (var i = 0; i < messages[chatId].length; i++) {
                            if (messages[chatId][i].id !== messageId) {
                                newMsgs.push(messages[chatId][i]);
                            }
                        }
                        messages[chatId] = newMsgs;
                        renderMessages(chatId);
                    }
                } else {
                    showToast('Cannot delete (need admin rights)');
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            cancelReply.addEventListener('click', function() {
                replyTarget = null;
                replyBar.classList.remove('show');
            });

            ctxReply.addEventListener('click', function() {
                if (replyTarget) {
                    replyText.textContent = replyTarget.from + ': ' + replyTarget.text.substring(0, 40) + (replyTarget.text.length > 40 ? '...' : '');
                    replyBar.classList.add('show');
                    messageInput.focus();
                    contextMenu.style.display = 'none';
                }
            });
            ctxDelete.addEventListener('click', function() {
                if (replyTarget && currentGroupId) {
                    deleteMessage(currentGroupId, replyTarget.message_id);
                    contextMenu.style.display = 'none';
                }
            });
            document.addEventListener('click', function() {
                contextMenu.style.display = 'none';
            });

            addGroupBtn.addEventListener('click', function() {
                modal.classList.add('show');
                modalInput.value = '';
                modalInput.focus();
            });
            modalCancel.addEventListener('click', function() {
                modal.classList.remove('show');
            });
            modalConfirm.addEventListener('click', function() {
                var id = modalInput.value.trim();
                if (!id) {
                    showToast('Enter group ID');
                    return;
                }
                modal.classList.remove('show');
                addGroupById(id);
            });
            modalInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') modalConfirm.click();
            });
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.classList.remove('show');
            });

            setInterval(function() {
                if (currentGroupId) {
                    apiCall('getMe', {}).then(function(r) {
                        if (!r.ok) {
                            setStatus('error', 'Reconnecting');
                        } else {
                            setStatus('online', 'Online');
                        }
                    });
                }
            }, 30000);

            async function init() {
                setStatus('', 'Loading...');
                var loaded = await loadGroups();
                if (!loaded || groups.length === 0) {
                    chatContainer.innerHTML = '<div style="text-align:center;padding:40px;color:#666;font-size:13px;">No groups found.<br>Add bot to a group as admin or click "+ Add Group"</div>';
                }
                setStatus('online', 'Online');
                if (currentGroupId) {
                    selectGroup(currentGroupId);
                }
            }

            init();

            if ('serviceWorker' in navigator) {
                var swCode = 'self.addEventListener("install",function(){self.skipWaiting()});self.addEventListener("activate",function(){self.clients.claim()});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).catch(function(){return new Response("Offline",{status:503})}))});';
                try {
                    var blob = new Blob([swCode], { type: 'application/javascript' });
                    var swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).then(function() {
                        console.log('SW registered');
                    }).catch(function() {});
                } catch(e) {}
            }

            console.log('Bot Manager v3.0');
            console.log('User ID:', USER_ID);
            console.log('Bot Token:', BOT_TOKEN);
        })();
    </script>
</body>
</html>
