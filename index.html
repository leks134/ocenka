<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Bot Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #0d0d12;
            color: #ffffff;
        }

        body {
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0);
            background-size: 20px 20px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        #header {
            background: rgba(22, 22, 28, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            min-height: 52px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #a2b2c8;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
        }

        .header-center {
            background: rgba(30, 30, 38, 0.9);
            border-radius: 18px;
            padding: 4px 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-title { font-size: 14px; font-weight: 600; color: #ffffff; line-height: 1.2; }
        .header-subtitle { font-size: 11px; color: #707579; margin-top: 1px; }

        /* Groups Panel */
        #groups-panel {
            background: #16161c;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            display: flex; gap: 6px;
            overflow-x: auto;
            align-items: center;
        }
        #groups-panel::-webkit-scrollbar { display: none; }

        .group-btn {
            background: #21212a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8e94a0;
            padding: 5px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .group-btn.active {
            background: #6c38cc;
            border-color: #8e52ec;
            color: #ffffff;
            font-weight: 600;
        }
        #add-group-btn {
            background: rgba(108, 56, 204, 0.15);
            border: 1px dashed #6c38cc;
            color: #a882f4;
            padding: 5px 10px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
        }

        /* Chat Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        /* Date Divider */
        .date-divider {
            align-self: center;
            background: rgba(30, 30, 40, 0.75);
            backdrop-filter: blur(8px);
            color: #a2b2c8;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 12px;
            margin: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 5;
        }

        /* Message Structure */
        .message-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin: 2px 0;
            max-width: 85%;
        }
        .message-wrapper.incoming { align-self: flex-start; }
        .message-wrapper.outgoing { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #fff;
            flex-shrink: 0;
        }

        .message-bubble {
            position: relative;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.35;
            word-break: break-word;
            min-width: 120px;
        }

        .message-wrapper.incoming .message-bubble {
            background: #21212a;
            color: #f5f5f5;
            border-bottom-left-radius: 4px;
        }

        .message-wrapper.outgoing .message-bubble {
            background: #5b2fa0;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message-header {
            display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
        }

        .message-name { font-size: 13px; font-weight: 600; }

        .badge-admin {
            background: rgba(46, 204, 113, 0.18);
            color: #2ecc71;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: 500;
        }

        .reply-indicator {
            background: rgba(0, 0, 0, 0.25);
            border-left: 2px solid #a882f4;
            padding: 4px 8px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 6px;
            font-size: 11px;
        }
        .reply-from { font-weight: 600; color: #a882f4; }
        .reply-text { color: #d1d5db; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .meta {
            display: inline-flex; align-items: center; gap: 3px;
            float: right; margin-left: 10px; margin-top: 4px;
            font-size: 10px; color: rgba(255, 255, 255, 0.5);
        }

        .photo-attachment {
            width: 100%; max-height: 280px;
            border-radius: 10px; object-fit: cover;
            margin-top: 4px; display: block;
        }

        .deleted-text { font-style: italic; color: #ff6b6b; opacity: 0.85; font-size: 12px; font-weight: 600; }

        /* Reply Bar */
        #reply-bar {
            display: none;
            background: #16161c;
            padding: 6px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        #reply-bar.show { display: flex; }
        .reply-bar-info { border-left: 2px solid #8e52ec; padding-left: 8px; }
        .reply-bar-user { font-size: 11px; color: #8e52ec; font-weight: 600; }
        .reply-bar-text { font-size: 11px; color: #a2b2c8; }
        .reply-bar-close { color: #8e94a0; cursor: pointer; font-size: 16px; padding: 0 4px; }

        /* Input Area */
        #input-area {
            background: #16161c;
            padding: 8px 10px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            display: flex; align-items: center; gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1; background: #21212a;
            border-radius: 20px; padding: 6px 14px;
            display: flex; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #message-input {
            width: 100%; background: transparent;
            border: none; outline: none;
            color: #ffffff; font-size: 14px;
        }

        .send-btn {
            background: #6c38cc; border: none;
            width: 36px; height: 36px; border-radius: 50%;
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }

        /* Context Menu & Modal */
        #context-menu {
            display: none; position: fixed;
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 4px;
            z-index: 1000; min-width: 120px;
        }
        #context-menu .item {
            padding: 8px 12px; font-size: 12px;
            border-radius: 8px; cursor: pointer; color: #e0e0e0;
        }

        .toast {
            position: fixed; bottom: 65px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 38, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 16px; border-radius: 16px;
            font-size: 12px; color: #fff; opacity: 0;
            transition: opacity 0.2s; pointer-events: none; z-index: 999;
        }
        .toast.show { opacity: 1; }

        #modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
            z-index: 1001;
        }
        #modal.show { display: flex; }
        .modal-body {
            background: #1c1c24; border-radius: 16px;
            padding: 18px; width: 85%; max-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-body h3 { font-size: 15px; margin-bottom: 6px; }
        .modal-body p { font-size: 12px; color: #707579; margin-bottom: 12px; }
        .modal-body input {
            width: 100%; padding: 8px 12px;
            background: #252530; border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; color: #fff; outline: none;
            font-size: 13px; margin-bottom: 12px;
        }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btns button {
            padding: 6px 14px; border-radius: 8px; border: none;
            font-size: 12px; cursor: pointer; font-weight: 600;
        }
        .btn-cancel { background: transparent; color: #8e94a0; }
        .btn-confirm { background: #6c38cc; color: #fff; }

        .empty-state { text-align: center; margin: auto; color: #707579; font-size: 13px; }
    </style>
</head>
<body>

    <div id="header">
        <button class="header-btn">‹</button>
        <div class="header-center">
            <div class="header-title" id="chat-title">Telegram Менеджер</div>
            <div class="header-subtitle" id="chat-status">Загрузка...</div>
        </div>
        <div class="header-btn" style="font-size: 11px;" id="status-dot">●</div>
    </div>

    <div id="groups-panel">
        <button id="add-group-btn">+ Добавить группу</button>
    </div>

    <div id="chat-container">
        <div class="empty-state" id="empty-state-text">Загрузка сообщений...</div>
    </div>

    <div id="reply-bar">
        <div class="reply-bar-info">
            <div class="reply-bar-user" id="reply-from">Имя</div>
            <div class="reply-bar-text" id="reply-text">Текст сообщения</div>
        </div>
        <div class="reply-bar-close" id="cancel-reply">✕</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        </div>
        <button class="send-btn" id="send-btn">➤</button>
    </div>

    <div id="context-menu">
        <div class="item" id="ctx-reply">Ответить</div>
        <div class="item" id="ctx-copy">Копировать</div>
        <div class="item" id="ctx-delete" style="color: #ff5959;">Удалить</div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="modal">
        <div class="modal-body">
            <h3>Добавить группу</h3>
            <p>Введите ID группы (-100...)</p>
            <input type="text" id="modal-input" placeholder="-1001234567890">
            <div class="modal-btns">
                <button class="btn-cancel" id="modal-cancel">Отмена</button>
                <button class="btn-confirm" id="modal-confirm">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const BOT_TOKEN = '8413201181:AAGUetUusFIsnKT9oS2haAZujYfs6Fm2klE';
            const BOT_ID = BOT_TOKEN.split(':')[0]; 
            const API_BASE = 'https://api.telegram.org/bot' + BOT_TOKEN;
            
            const KEYS = ['tg_groups_v7'];
            const MSG_KEYS = ['tg_messages_v7'];
            const DEL_KEYS = ['tg_deleted_v7'];

            const NAME_COLORS = ['#ff8e8e', '#f39c12', '#a882f4', '#2ecc71', '#3498db', '#e84393', '#00cec9', '#ff5959'];

            let groups = [];
            let currentGroupId = null;
            let messages = {};
            let deletedMessages = {};
            let replyTarget = null;
            let updateInterval = null;
            let offset = 0;
            let currentContextMsg = null;
            let toastTimer = null;

            const chatContainer = document.getElementById('chat-container');
            const groupsPanel = document.getElementById('groups-panel');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const replyBar = document.getElementById('reply-bar');
            const replyFrom = document.getElementById('reply-from');
            const replyText = document.getElementById('reply-text');
            const cancelReply = document.getElementById('cancel-reply');
            const toast = document.getElementById('toast');
            const contextMenu = document.getElementById('context-menu');
            const ctxReply = document.getElementById('ctx-reply');
            const ctxDelete = document.getElementById('ctx-delete');
            const ctxCopy = document.getElementById('ctx-copy');
            const modal = document.getElementById('modal');
            const modalInput = document.getElementById('modal-input');
            const modalCancel = document.getElementById('modal-cancel');
            const modalConfirm = document.getElementById('modal-confirm');
            const addGroupBtn = document.getElementById('add-group-btn');
            const chatTitle = document.getElementById('chat-title');
            const statusDot = document.getElementById('status-dot');

            function showToast(text) {
                toast.textContent = text;
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function getUserColor(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
                return NAME_COLORS[Math.abs(hash) % NAME_COLORS.length];
            }

            function getInitials(name) {
                if (!name) return '?';
                let parts = name.trim().split(' ');
                return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : name.substring(0, 1).toUpperCase();
            }

            function formatDateDivider(timestamp) {
                const msgDate = new Date(timestamp * 1000);
                const now = new Date();
                if (msgDate.toDateString() === now.toDateString()) return 'Сегодня';
                const yesterday = new Date(now);
                yesterday.setDate(now.getDate() - 1);
                if (msgDate.toDateString() === yesterday.toDateString()) return 'Вчера';
                return msgDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
            }

            function saveAll() {
                try {
                    localStorage.setItem(KEYS[0], JSON.stringify(groups));
                    localStorage.setItem(MSG_KEYS[0], JSON.stringify(messages));
                    localStorage.setItem(DEL_KEYS[0], JSON.stringify(deletedMessages));
                } catch(e) {}
            }

            function loadStorage() {
                try {
                    groups = JSON.parse(localStorage.getItem(KEYS[0])) || [];
                    messages = JSON.parse(localStorage.getItem(MSG_KEYS[0])) || {};
                    deletedMessages = JSON.parse(localStorage.getItem(DEL_KEYS[0])) || {};
                } catch(e) {}
            }

            async function apiCall(method, params = {}) {
                try {
                    let form = new FormData();
                    for (let k in params) {
                        if (params[k] !== undefined && params[k] !== null) form.append(k, params[k]);
                    }
                    let res = await fetch(API_BASE + '/' + method, { method: 'POST', body: form });
                    return await res.json();
                } catch (e) {
                    return { ok: false };
                }
            }

            async function getPhotoUrl(fileId) {
                let res = await apiCall('getFile', { file_id: fileId });
                if (res.ok && res.result) {
                    return `https://api.telegram.org/file/bot${BOT_TOKEN}/${res.result.file_path}`;
                }
                return null;
            }

            function renderGroups() {
                const addBtn = document.getElementById('add-group-btn');
                groupsPanel.innerHTML = '';
                groupsPanel.appendChild(addBtn);
                groups.forEach(g => {
                    let btn = document.createElement('button');
                    btn.className = 'group-btn' + (currentGroupId === g.id ? ' active' : '');
                    btn.textContent = g.title;
                    btn.onclick = () => selectGroup(g.id);
                    groupsPanel.appendChild(btn);
                });
            }

            async function selectGroup(id) {
                if (updateInterval) clearInterval(updateInterval);
                currentGroupId = id;
                let g = groups.find(x => x.id === id);
                if (g) chatTitle.textContent = g.title;

                renderGroups();
                if (!messages[currentGroupId]) messages[currentGroupId] = [];
                if (!deletedMessages[currentGroupId]) deletedMessages[currentGroupId] = {};

                renderMessages(currentGroupId);
                await fetchUpdates();
                
                updateInterval = setInterval(fetchUpdates, 1500);
            }

            async function fetchUpdates() {
                let result = await apiCall('getUpdates', { offset: offset, timeout: 0, allowed_updates: JSON.stringify(["message", "edited_message"]) });
                if (!result.ok || !result.result) return;

                statusDot.style.color = '#2ecc71';
                let updated = false;

                for (let u of result.result) {
                    offset = u.update_id + 1;

                    let msg = u.message || u.edited_message;
                    if (msg && msg.chat) {
                        let chatId = msg.chat.id;

                        if (!groups.some(g => g.id === chatId) && (msg.chat.type === 'group' || msg.chat.type === 'supergroup')) {
                            groups.push({ id: chatId, title: msg.chat.title || 'Группа' });
                            renderGroups();
                        }

                        if (!messages[chatId]) messages[chatId] = [];

                        let photoUrl = null;
                        if (msg.photo && msg.photo.length > 0) {
                            photoUrl = await getPhotoUrl(msg.photo[msg.photo.length - 1].file_id);
                        }

                        let replyData = null;
                        if (msg.reply_to_message) {
                            let rFrom = msg.reply_to_message.from ? (msg.reply_to_message.from.first_name + (msg.reply_to_message.from.last_name ? ' ' + msg.reply_to_message.from.last_name : '')) : 'Пользователь';
                            replyData = {
                                text: msg.reply_to_message.text || 'Фотография',
                                from: rFrom
                            };
                        }

                        let senderName = 'Пользователь';
                        let isFromBot = false;

                        if (msg.from) {
                            if (String(msg.from.id) === String(BOT_ID) || msg.from.is_bot) {
                                isFromBot = true;
                                senderName = 'Haiinted Ai';
                            } else {
                                senderName = msg.from.first_name || '';
                                if (msg.from.last_name) senderName += ' ' + msg.from.last_name;
                                if (!senderName.trim() && msg.from.username) senderName = msg.from.username;
                            }
                        }

                        let newMsg = {
                            id: msg.message_id,
                            text: msg.text || (photoUrl ? '' : ''),
                            from: senderName,
                            isOut: isFromBot,
                            date: msg.date,
                            photo: photoUrl,
                            reply: replyData,
                            isAdmin: isFromBot || (msg.from && (msg.from.username === 'admin' || msg.from.first_name?.toLowerCase().includes('admin')))
                        };

                        let existingIndex = messages[chatId].findIndex(m => m.id === msg.message_id);
                        if (existingIndex === -1) {
                            messages[chatId].push(newMsg);
                        } else {
                            messages[chatId][existingIndex] = newMsg;
                        }
                        updated = true;
                    }
                }

                if (updated) {
                    saveAll();
                    if (currentGroupId) {
                        renderMessages(currentGroupId);
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }
            }

            function renderMessages(chatId) {
                if (!chatId) {
                    chatContainer.innerHTML = '<div class="empty-state">Нажмите "+ Добавить группу"</div>';
                    return;
                }

                let msgs = messages[chatId] || [];
                let deleted = deletedMessages[chatId] || {};

                let allMap = new Map();

                msgs.forEach(m => allMap.set(m.id, { ...m, isDeleted: false }));
                for (let id in deleted) {
                    allMap.set(parseInt(id), { ...deleted[id], id: parseInt(id), isDeleted: true });
                }

                let all = Array.from(allMap.values()).sort((a,b) => a.date - b.date);

                if (all.length === 0) {
                    chatContainer.innerHTML = '<div class="empty-state">Сообщений пока нет</div>';
                    return;
                }

                let html = '';
                let lastDateStr = '';

                all.forEach(m => {
                    let dateStr = formatDateDivider(m.date);
                    if (dateStr !== lastDateStr) {
                        html += `<div class="date-divider">${dateStr}</div>`;
                        lastDateStr = dateStr;
                    }

                    let isDel = m.isDeleted;
                    let isOut = m.isOut;
                    let cls = isOut ? 'outgoing' : 'incoming';
                    let time = new Date(m.date * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    let displayName = m.from || 'Пользователь';
                    let nameColor = getUserColor(displayName);
                    let initials = getInitials(displayName);

                    html += `<div class="message-wrapper ${cls}">`;
                    html += `<div class="avatar" style="background: ${nameColor}">${initials}</div>`;
                    html += `<div class="message-bubble" data-id="${m.id}" data-text="${(m.text || '').replace(/"/g, '&quot;')}" data-from="${displayName}">`;

                    html += `<div class="message-header">
                        <span class="message-name" style="color: ${nameColor}">${displayName}</span>
                        ${m.isAdmin ? '<span class="badge-admin">админ</span>' : ''}
                    </div>`;

                    if (m.reply) {
                        html += `<div class="reply-indicator">
                            <div class="reply-from">${m.reply.from}</div>
                            <div class="reply-text">${m.reply.text}</div>
                        </div>`;
                    }

                    if (isDel) {
                        html += `<div class="deleted-text">🚫 Сообщение удалено</div>`;
                        if (m.text) html += `<div style="opacity:0.8; font-size:13px; margin-top:2px;">${m.text}</div>`;
                    } else {
                        if (m.text) html += `<div>${m.text}</div>`;
                        if (m.photo) html += `<img src="${m.photo}" class="photo-attachment" onclick="window.open('${m.photo}')">`;
                    }

                    html += `<div class="meta">${time} ${isOut ? '✓' : ''}</div>`;
                    html += `</div></div>`;
                });

                chatContainer.innerHTML = html;

                document.querySelectorAll('.message-bubble').forEach(el => {
                    let touchTimer;
                    el.addEventListener('click', (e) => {
                        if (e.target.tagName === 'IMG') return;
                        let id = parseInt(el.dataset.id);
                        let text = el.dataset.text;
                        let from = el.dataset.from;
                        if (text) {
                            replyTarget = { id, text, from };
                            replyFrom.textContent = from;
                            replyText.textContent = text;
                            replyBar.classList.add('show');
                            messageInput.focus();
                        }
                    });

                    el.addEventListener('touchstart', (e) => {
                        touchTimer = setTimeout(() => {
                            currentContextMsg = {
                                id: parseInt(el.dataset.id),
                                text: el.dataset.text,
                                from: el.dataset.from
                            };
                            let t = e.touches[0];
                            contextMenu.style.display = 'block';
                            contextMenu.style.left = Math.min(t.clientX, window.innerWidth - 130) + 'px';
                            contextMenu.style.top = Math.min(t.clientY, window.innerHeight - 120) + 'px';
                        }, 400);
                    });

                    el.addEventListener('touchend', () => clearTimeout(touchTimer));
                    el.addEventListener('touchmove', () => clearTimeout(touchTimer));
                });
            }

            async function sendMessage() {
                let text = messageInput.value.trim();
                if (!text || !currentGroupId) return;

                let params = { chat_id: currentGroupId, text: text };
                if (replyTarget) params.reply_to_message_id = replyTarget.id;

                let res = await apiCall('sendMessage', params);
                if (res.ok) {
                    let msg = {
                        id: res.result.message_id,
                        text: text,
                        from: 'Haiinted Ai',
                        isOut: true,
                        date: Math.floor(Date.now() / 1000),
                        reply: replyTarget ? { text: replyTarget.text, from: replyTarget.from } : null,
                        isAdmin: true
                    };

                    messages[currentGroupId].push(msg);
                    renderMessages(currentGroupId);
                    saveAll();

                    messageInput.value = '';
                    replyTarget = null;
                    replyBar.classList.remove('show');
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    showToast('Ошибка отправки');
                }
            }

            async function deleteMessage(chatId, messageId) {
                let target = (messages[chatId] || []).find(m => m.id === messageId);
                
                await apiCall('deleteMessage', { chat_id: chatId, message_id: messageId });

                if (target) {
                    if (!deletedMessages[chatId]) deletedMessages[chatId] = {};
                    deletedMessages[chatId][messageId] = { ...target };
                    messages[chatId] = messages[chatId].filter(m => m.id !== messageId);
                    
                    renderMessages(chatId);
                    saveAll();
                    showToast('Сообщение перенесено в удалённые');
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
            cancelReply.addEventListener('click', () => { replyTarget = null; replyBar.classList.remove('show'); });

            ctxReply.addEventListener('click', () => {
                if (currentContextMsg) {
                    replyTarget = currentContextMsg;
                    replyFrom.textContent = currentContextMsg.from;
                    replyText.textContent = currentContextMsg.text;
                    replyBar.classList.add('show');
                    contextMenu.style.display = 'none';
                }
            });

            ctxCopy.addEventListener('click', () => {
                if (currentContextMsg?.text) {
                    navigator.clipboard.writeText(currentContextMsg.text);
                    showToast('Скопировано');
                }
                contextMenu.style.display = 'none';
            });

            ctxDelete.addEventListener('click', () => {
                if (currentContextMsg && currentGroupId) {
                    deleteMessage(currentGroupId, currentContextMsg.id);
                }
                contextMenu.style.display = 'none';
            });

            document.addEventListener('click', () => contextMenu.style.display = 'none');

            addGroupBtn.addEventListener('click', () => modal.classList.add('show'));
            modalCancel.addEventListener('click', () => modal.classList.remove('show'));
            modalConfirm.addEventListener('click', async () => {
                let id = modalInput.value.trim();
                if (id) {
                    let info = await apiCall('getChat', { chat_id: id });
                    if (info.ok) {
                        let newGroup = { id: info.result.id, title: info.result.title || 'Группа' };
                        if (!groups.some(g => g.id === newGroup.id)) {
                            groups.push(newGroup);
                        }
                        saveAll();
                        renderGroups();
                        selectGroup(newGroup.id);
                        modal.classList.remove('show');
                        modalInput.value = '';
                        showToast('Группа добавлена');
                    } else {
                        showToast('Группа не найдена');
                    }
                }
            });

            async function init() {
                loadStorage();
                
                // Удаляем вебхук и сбрасываем offset до актуального состояния
                await apiCall('deleteWebhook', { drop_pending_updates: false });
                
                renderGroups();
                await fetchUpdates();

                if (groups.length > 0) {
                    selectGroup(groups[0].id);
                } else {
                    renderMessages(null);
                }
            }

            init();
        })();
    </script>
</body>
</html>
