<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎧 Video → Voice Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #111;
            border: 2px solid #00ffcc;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.15);
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            text-shadow: 0 0 20px #00ffcc;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }
        .status {
            background: #0f0f0f;
            padding: 12px;
            border-radius: 12px;
            border-left: 5px solid #00ffcc;
            margin-bottom: 25px;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .upload-zone {
            border: 3px dashed #00ffcc;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-zone:hover {
            border-color: #ff00cc;
            background: #1a1a1a;
        }
        .upload-zone input { display: none; }
        .upload-zone label { font-size: 1.2rem; cursor: pointer; }
        .preview { margin-top: 15px; }
        .preview video { max-width: 100%; max-height: 250px; border-radius: 12px; border: 2px solid #00ffcc; }
        .btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff00cc;
            color: #fff;
            box-shadow: 0 0 40px #ff00cc;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .log {
            margin-top: 25px;
            background: #0f0f0f;
            border-radius: 15px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.85rem;
            border: 1px solid #00ffcc;
        }
        .log .msg { padding: 5px 0; border-bottom: 1px solid #222; }
        .log .msg .time { color: #888; margin-right: 10px; }
        .log .msg .ok { color: #00ffcc; }
        .log .msg .err { color: #ff4444; }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎧 VIDEO → VOICE</h1>
    <div class="sub">Загрузи видео — получи голосовое сообщение в Telegram</div>

    <div class="status" id="botStatus">
        ⏳ Подключение к Telegram Bot API...
    </div>

    <div class="upload-zone" id="dropZone">
        <input type="file" id="fileInput" accept="video/*">
        <label for="fileInput">📁 Нажми, чтобы выбрать видео</label>
        <div class="preview" id="preview"></div>
    </div>

    <button class="btn" id="sendBtn">🚀 Отправить и конвертировать</button>

    <div class="log" id="logBox">
        <div style="color: #666;">📋 Лог событий...</div>
    </div>

    <div class="footer">by @zazayaga | mayfive v3.0 — отказ = анигиляция</div>
</div>

<script>
    // ============================================================
    //  КОНФИГУРАЦИЯ
    // ============================================================
    const BOT_TOKEN = '8998947312:AAGyGHIyi4cSqUzKmeIhQzSLJLXXH3kkmXg';
    const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}`;

    // ============================================================
    //  СОСТОЯНИЕ
    // ============================================================
    let currentFile = null;
    let chatId = null;  // будет получен автоматически
    let botReady = false;

    // ============================================================
    //  DOM-ЭЛЕМЕНТЫ
    // ============================================================
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const preview = document.getElementById('preview');
    const sendBtn = document.getElementById('sendBtn');
    const logBox = document.getElementById('logBox');
    const botStatus = document.getElementById('botStatus');

    // ============================================================
    //  ЛОГИРОВАНИЕ
    // ============================================================
    function addLog(msg, type = 'ok') {
        const div = document.createElement('div');
        div.className = 'msg';
        const time = new Date().toLocaleTimeString();
        div.innerHTML = `<span class="time">[${time}]</span><span class="${type}">${msg}</span>`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // ============================================================
    //  ПОДКЛЮЧЕНИЕ К БОТУ + ПОЛУЧЕНИЕ CHAT_ID
    // ============================================================
    async function initBot() {
        try {
            botStatus.textContent = '🔄 Проверка бота...';
            const resp = await fetch(`${API_URL}/getMe`);
            const data = await resp.json();
            if (!data.ok) throw new Error('Бот не отвечает');

            const botInfo = data.result;
            botStatus.textContent = `✅ Бот подключен: @${botInfo.username}`;
            addLog(`✅ Бот @${botInfo.username} активен`, 'ok');

            // Получаем обновления, чтобы выцепить chat_id
            const updatesResp = await fetch(`${API_URL}/getUpdates?limit=1`);
            const updatesData = await updatesResp.json();
            
            if (updatesData.ok && updatesData.result.length > 0) {
                const lastUpdate = updatesData.result[updatesData.result.length - 1];
                if (lastUpdate.message) {
                    chatId = lastUpdate.message.chat.id;
                    addLog(`📩 Найден чат: ${chatId} (отправляй туда ГС)`, 'ok');
                } else if (lastUpdate.callback_query) {
                    chatId = lastUpdate.callback_query.from.id;
                    addLog(`📩 Найден чат через callback: ${chatId}`, 'ok');
                }
            } else {
                // Если нет сообщений — просим написать боту
                addLog('⚠️ Напиши что-нибудь боту в Telegram, чтобы я узнал твой chat_id', 'err');
                botStatus.textContent += ' — напишите боту любое сообщение';
                chatId = null;
            }

            botReady = true;
            sendBtn.disabled = false;
        } catch (e) {
            botStatus.textContent = '❌ Ошибка подключения к боту';
            addLog(`❌ Ошибка: ${e.message}`, 'err');
            sendBtn.disabled = true;
        }
    }

    // ============================================================
    //  ЗАГРУЗКА ВИДЕО
    // ============================================================
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        currentFile = file;
        const reader = new FileReader();
        reader.onload = (ev) => {
            preview.innerHTML = `<video controls src="${ev.target.result}"></video>`;
        };
        reader.readAsDataURL(file);
        addLog(`📁 Загружено видео: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`, 'ok');
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#ff00cc';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#00ffcc';
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) {
            fileInput.files = e.dataTransfer.files;
            const event = new Event('change');
            fileInput.dispatchEvent(event);
        }
    });

    // ============================================================
    //  ОСНОВНАЯ ФУНКЦИЯ — ОТПРАВКА ВИДЕО → КОНВЕРТАЦИЯ → ГС
    // ============================================================
    sendBtn.addEventListener('click', async () => {
        if (!botReady || !chatId) {
            addLog('❌ Бот не готов или нет chat_id. Напиши боту в Telegram', 'err');
            return;
        }
        if (!currentFile) {
            addLog('❌ Сначала выбери видео', 'err');
            return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = '⏳ Отправка...';
        addLog('📤 Отправка видео боту...', 'ok');

        try {
            // 1. Отправляем видео боту через sendDocument
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', currentFile);
            formData.append('caption', '🎥 Видео для конвертации в голосовое');

            const uploadResp = await fetch(`${API_URL}/sendDocument`, {
                method: 'POST',
                body: formData
            });
            const uploadData = await uploadResp.json();

            if (!uploadData.ok) {
                throw new Error(`Ошибка отправки: ${uploadData.description}`);
            }

            const fileId = uploadData.result.document.file_id;
            addLog(`✅ Видео отправлено, file_id: ${fileId}`, 'ok');

            // 2. Получаем ссылку на скачивание видео (через getFile)
            const fileInfoResp = await fetch(`${API_URL}/getFile?file_id=${fileId}`);
            const fileInfo = await fileInfoResp.json();
            if (!fileInfo.ok) throw new Error('Не удалось получить информацию о файле');

            const filePath = fileInfo.result.file_path;
            const fileUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${filePath}`;
            addLog(`📥 Ссылка на видео: ${fileUrl}`, 'ok');

            // 3. ИМИТАЦИЯ КОНВЕРТАЦИИ (на самом деле мы не можем конвертировать на клиенте)
            //    Но мы можем отправить команду боту на сервер (если он умеет) — это уже бэкенд.
            //    Для чистого HTML мы делаем имитацию + инструкцию.

            addLog('🔄 Имитация конвертации... (реальная конвертация требует серверной части)', 'ok');

            // Симулируем задержку
            await new Promise(resolve => setTimeout(resolve, 3000));

            // 4. Отправляем голосовое (имитация — на самом деле мы не можем сгенерировать OGG в браузере)
            //    Поэтому отправляем текстовое сообщение с инструкцией
            const fakeVoiceMsg = `🎵 Голосовое сообщение из видео "${currentFile.name}" готово! 
(Реальная конвертация требует бэкенд-сервера. Я могу написать его на Python + FFmpeg)`;

            const sendVoiceResp = await fetch(`${API_URL}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: fakeVoiceMsg
                })
            });
            const sendVoiceData = await sendVoiceResp.json();
            if (!sendVoiceData.ok) {
                throw new Error(`Ошибка отправки ГС: ${sendVoiceData.description}`);
            }

            addLog('✅ Готово! Бот отправил тебе голосовое (имитация)', 'ok');
            addLog('📌 Для реальной конвертации нужен сервер с FFmpeg, могу написать', 'ok');

        } catch (e) {
            addLog(`❌ Ошибка: ${e.message}`, 'err');
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = '🚀 Отправить и конвертировать';
        }
    });

    // ============================================================
    //  ЗАПУСК
    // ============================================================
    initBot();

    // Дополнительная подсказка
    addLog('💡 Как это работает: загрузи видео → бот получит файл → (имитация конвертации) → результат в Telegram', 'ok');
    addLog('🔧 Для реальной конвертации (FFmpeg) — я напишу бэкенд на Python / Node.js, если нужно', 'ok');
</script>

</body>
</html>
