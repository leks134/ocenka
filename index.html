<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 TG Group Bot Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.05);
            height: 95vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #0088cc, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online {
            background: #6bcb77;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #ff6b6b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .bot-info {
            font-size: 11px;
            color: #555;
            text-align: right;
        }

        .bot-info strong {
            color: #00d2ff;
        }

        /* ===== ГРУППЫ ===== */
        .groups-section {
            flex-shrink: 0;
            margin: 12px 0;
        }

        .groups-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 8px 0;
            -webkit-overflow-scrolling: touch;
        }

        .groups-scroll::-webkit-scrollbar {
            height: 3px;
        }

        .groups-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .group-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .group-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .group-btn.active {
            background: rgba(0,210,255,0.12);
            border-color: #00d2ff;
            color: #fff;
            box-shadow: 0 0 20px rgba(0,210,255,0.05);
        }

        .group-btn .badge {
            background: rgba(255,255,255,0.08);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            color: #888;
        }

        .group-btn .badge.unread {
            background: #ff6b6b;
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        .group-btn .add-btn {
            color: #00d2ff;
            font-size: 16px;
        }

        /* ===== ЧАТ ===== */
        .chat-container {
            flex: 1;
            background: rgba(0,0,0,0.25);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .chat-messages::-webkit-scrollbar {
            width: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
        }

        .chat-empty {
            text-align: center;
            color: #444;
            padding: 40px 20px;
            font-size: 14px;
        }

        .chat-empty .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .message {
            max-width: 88%;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: msgIn 0.25s ease;
            position: relative;
            transition: all 0.15s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.outgoing {
            align-self: flex-end;
            background: linear-gradient(135deg, #0088cc, #00aaff);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .message.incoming {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border-bottom-left-radius: 4px;
            color: #ddd;
            cursor: default;
            transition: background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .message.incoming:active {
            background: rgba(0,210,255,0.12);
            transform: scale(0.98);
        }

        .message.incoming.selected {
            background: rgba(0,210,255,0.15);
            border: 1px solid rgba(0,210,255,0.2);
        }

        .message .msg-sender {
            font-size: 11px;
            color: #00d2ff;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .message .msg-text {
            word-break: break-word;
        }

        .message .msg-meta {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            align-items: center;
        }

        .message .msg-meta .check {
            color: #6bcb77;
            font-size: 12px;
        }

        .message .reply-indicator {
            font-size: 11px;
            color: #f7971e;
            padding: 3px 10px;
            background: rgba(247,151,30,0.08);
            border-radius: 8px;
            border-left: 2px solid #f7971e;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message .reply-indicator .reply-icon {
            font-size: 12px;
        }

        /* ===== Поле ввода ===== */
        .chat-input-area {
            padding: 10px 12px 12px 12px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }

        .reply-badge {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 8px 12px;
            font-size: 12px;
            color: #f7971e;
            animation: msgIn 0.2s ease;
        }

        .reply-badge.show {
            display: flex;
        }

        .reply-badge .reply-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.7;
        }

        .reply-badge .cancel-reply {
            cursor: pointer;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 16px;
            padding: 0 4px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-row input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-row input:focus {
            border-color: rgba(0,210,255,0.3);
        }

        .input-row input::placeholder {
            color: #444;
        }

        .input-row input:disabled {
            opacity: 0.4;
        }

        .send-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #0088cc, #00d2ff);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            flex-shrink: 0;
            min-width: 60px;
        }

        .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(0,210,255,0.2);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== МОДАЛКА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.25s ease;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 28px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.06);
            animation: msgIn 0.3s ease;
        }

        .modal h3 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
        }

        .modal input:focus {
            outline: none;
            border-color: rgba(0,210,255,0.3);
        }

        .modal .hint {
            font-size: 11px;
            color: #555;
            margin-bottom: 12px;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .modal-actions .confirm {
            background: linear-gradient(135deg, #0088cc, #00d2ff);
            color: #fff;
        }

        .modal-actions .cancel {
            background: rgba(255,255,255,0.05);
            color: #888;
        }

        .modal-actions button:hover {
            transform: scale(1.02);
        }

        /* ===== ТОСТ ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 10px 24px;
            background: rgba(0,0,0,0.92);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            color: #fff;
            font-size: 13px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2000;
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: #6bcb77; }
        .toast.error { border-color: #ff6b6b; }
        .toast.info { border-color: #00d2ff; }

        /* ===== МЕДИА ===== */
        @media (max-width: 480px) {
            body { padding: 8px; }
            .container { padding: 14px; border-radius: 20px; height: 98vh; }
            .message { font-size: 13px; padding: 7px 12px; max-width: 92%; }
            .group-btn { font-size: 12px; padding: 6px 12px; }
            .header h1 { font-size: 15px; }
            .send-btn { padding: 10px 14px; font-size: 13px; min-width: 50px; }
            .input-row input { padding: 8px 12px; font-size: 13px; }
            .modal { padding: 20px; }
        }

        @media (hover: none) {
            .message.incoming:hover { background: rgba(255,255,255,0.06); }
            .message.incoming:active { background: rgba(0,210,255,0.12); transform: scale(0.97); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <h1>🤖 Group Bot</h1>
                <div class="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">запуск...</span>
                </div>
            </div>
            <div class="bot-info">
                <span id="botName">бот</span>
            </div>
        </div>

        <!-- ГРУППЫ -->
        <div class="groups-section">
            <div class="groups-scroll" id="groupsList">
                <button class="group-btn" onclick="showAddModal()">
                    <span class="add-btn">➕</span> Добавить
                </button>
            </div>
        </div>

        <!-- ЧАТ -->
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty">
                    <span class="icon">💬</span>
                    Выберите группу или добавьте новую<br>
                    <span style="font-size: 12px; color: #333;">Все сообщения будут здесь</span>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="reply-badge" id="replyBadge">
                    <span class="reply-icon">↩️</span>
                    <span class="reply-text" id="replyText">Ответ на сообщение</span>
                    <span class="cancel-reply" onclick="cancelReply()">✕</span>
                </div>
                <div class="input-row">
                    <input type="text" id="messageInput" placeholder="Сообщение..." 
                           onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h3>➕ Добавить группу</h3>
            <input type="text" id="groupChatId" placeholder="ID группы (-1001234567890)">
            <input type="text" id="groupName" placeholder="Название (опционально)">
            <div class="hint">Бот должен быть добавлен в группу</div>
            <div class="modal-actions">
                <button class="confirm" onclick="addGroup()">Добавить</button>
                <button class="cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ТОСТ -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ============ КОНФИГ ============
        // ============================================================
        const BOT_TOKEN = '8998947312:AAGyGHIyi4cSqUzKmeIhQzSLJLXXH3kkmXg';
        const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}`;
        const USER_ID = '5645726673';

        // ============================================================
        // ============ СОСТОЯНИЕ ============
        // ============================================================
        let state = {
            groups: [],
            currentGroup: null,
            messages: [],
            replyTo: null,
            updateId: 0,
            isPolling: false
        };

        let botInfo = null;

        // ============================================================
        // ============ ХРАНЕНИЕ ============
        // ============================================================
        function saveState() {
            try {
                localStorage.setItem('tg_bot_state', JSON.stringify({
                    groups: state.groups,
                    currentGroup: state.currentGroup,
                    messages: state.messages.slice(-500),
                    updateId: state.updateId
                }));
            } catch (e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('tg_bot_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    state.groups = data.groups || [];
                    state.currentGroup = data.currentGroup || null;
                    state.messages = data.messages || [];
                    state.updateId = data.updateId || 0;
                }
            } catch (e) {}
        }

        // ============================================================
        // ============ TELEGRAM API ============
        // ============================================================
        async function api(method, data = {}) {
            try {
                const res = await fetch(`${API_URL}/${method}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await res.json();
            } catch (e) {
                return { ok: false, error: e.message };
            }
        }

        async function sendMessage(chatId, text, replyId = null) {
            const data = { chat_id: chatId, text: text, parse_mode: 'HTML' };
            if (replyId) data.reply_to_message_id = replyId;
            return await api('sendMessage', data);
        }

        async function getUpdates(offset) {
            return await api('getUpdates', {
                offset: offset,
                timeout: 30,
                allowed_updates: ['message']
            });
        }

        async function getChat(chatId) {
            return await api('getChat', { chat_id: chatId });
        }

        async function leaveChat(chatId) {
            return await api('leaveChat', { chat_id: chatId });
        }

        async function getMe() {
            return await api('getMe');
        }

        // ============================================================
        // ============ ПОЛЛИНГ ============
        // ============================================================
        let pollingActive = false;

        async function startPolling() {
            if (pollingActive) return;
            pollingActive = true;

            // Проверяем бота
            const me = await getMe();
            if (!me.ok) {
                showToast('❌ Бот не доступен', 'error');
                pollingActive = false;
                updateStatus(false);
                return;
            }

            botInfo = me.result;
            document.getElementById('botName').textContent = `@${botInfo.username}`;
            updateStatus(true);
            showToast('🚀 Бот готов', 'success');

            // Запускаем цикл
            pollLoop();
        }

        async function pollLoop() {
            if (!pollingActive) return;

            try {
                const result = await getUpdates(state.updateId + 1);

                if (result.ok && result.result.length > 0) {
                    for (const update of result.result) {
                        state.updateId = update.update_id;
                        await processUpdate(update);
                    }
                    saveState();
                }

                updateUI();

            } catch (e) {
                console.warn('Poll error:', e);
            }

            if (pollingActive) {
                setTimeout(pollLoop, 1500);
            }
        }

        async function processUpdate(update) {
            if (!update.message) return;

            const msg = update.message;
            const chatId = String(msg.chat.id);

            // Проверяем, отслеживаем ли мы эту группу
            const group = state.groups.find(g => String(g.id) === chatId);
            if (!group) return;

            // Пропускаем свои сообщения
            if (msg.from && msg.from.id === botInfo?.id) return;

            const text = msg.text || msg.caption || '📎 Медиа';

            const messageData = {
                id: msg.message_id,
                chatId: chatId,
                text: text,
                from: {
                    id: msg.from?.id || 0,
                    username: msg.from?.username || msg.from?.first_name || 'Unknown'
                },
                date: msg.date || Math.floor(Date.now() / 1000),
                isOutgoing: false,
                replyToId: msg.reply_to_message?.message_id || null,
                replyToText: null
            };

            // Проверяем, ответ ли это на наше сообщение
            if (msg.reply_to_message && msg.reply_to_message.from?.id === botInfo?.id) {
                const original = state.messages.find(m => 
                    m.id === msg.reply_to_message.message_id && m.chatId === chatId
                );
                if (original) {
                    messageData.replyToText = original.text;
                }
            }

            state.messages.push(messageData);

            // Увеличиваем счетчик непрочитанных если это не текущая группа
            if (String(state.currentGroup) !== chatId) {
                const g = state.groups.find(gr => String(gr.id) === chatId);
                if (g) g.unread = (g.unread || 0) + 1;
            }

            // Обновляем последнее сообщение
            const gIdx = state.groups.findIndex(gr => String(gr.id) === chatId);
            if (gIdx !== -1) {
                state.groups[gIdx].lastMsg = {
                    text: text.substring(0, 40),
                    from: messageData.from.username,
                    time: new Date().toLocaleTimeString()
                };
            }

            // Если это текущая группа - сразу показываем
            if (String(state.currentGroup) === chatId) {
                renderMessages(chatId);
                scrollToBottom();
            } else {
                showToast(`📩 ${messageData.from.username}: ${text.substring(0, 40)}`, 'info');
            }
        }

        // ============================================================
        // ============ ОТПРАВКА ============
        // ============================================================
        async function sendMessage() {
            if (!state.currentGroup) {
                showToast('❌ Выберите группу', 'error');
                return;
            }

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;

            try {
                const replyId = state.replyTo?.id || null;
                const result = await sendMessage(state.currentGroup, text, replyId);

                if (result.ok) {
                    state.messages.push({
                        id: result.result.message_id,
                        chatId: state.currentGroup,
                        text: text,
                        from: { id: 'bot', username: 'Вы' },
                        date: Math.floor(Date.now() / 1000),
                        isOutgoing: true,
                        replyToId: replyId,
                        replyToText: state.replyTo?.text || null
                    });

                    cancelReply();
                    saveState();
                    renderMessages(state.currentGroup);
                    scrollToBottom();
                } else {
                    showToast('❌ Ошибка: ' + (result.description || 'Неизвестно'), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка отправки', 'error');
            }

            btn.disabled = false;
            input.focus();
        }

        // ============================================================
        // ============ ГРУППЫ ============
        // ============================================================
        function showAddModal() {
            document.getElementById('addModal').classList.add('show');
            document.getElementById('groupChatId').focus();
        }

        function closeModal() {
            document.getElementById('addModal').classList.remove('show');
        }

        async function addGroup() {
            const chatId = document.getElementById('groupChatId').value.trim();
            const name = document.getElementById('groupName').value.trim() || chatId;

            if (!chatId) {
                showToast('❌ Введите ID группы', 'error');
                return;
            }

            // Проверяем
            const result = await getChat(chatId);
            if (!result.ok) {
                showToast('❌ Группа не найдена', 'error');
                return;
            }

            if (state.groups.find(g => String(g.id) === chatId)) {
                showToast('⚠️ Уже добавлена', 'info');
                closeModal();
                return;
            }

            state.groups.push({
                id: chatId,
                name: name,
                title: result.result.title || name,
                unread: 0,
                lastMsg: null
            });

            closeModal();
            document.getElementById('groupChatId').value = '';
            document.getElementById('groupName').value = '';

            selectGroup(chatId);
            saveState();
            updateUI();
            showToast(`✅ Группа добавлена`, 'success');
        }

        function selectGroup(chatId) {
            state.currentGroup = chatId;
            state.replyTo = null;

            const group = state.groups.find(g => String(g.id) === chatId);
            if (group) group.unread = 0;

            document.getElementById('replyBadge').classList.remove('show');
            renderMessages(chatId);
            scrollToBottom();
            saveState();
            updateUI();

            document.getElementById('messageInput').focus();
            document.getElementById('messageInput').placeholder = `💬 ${group?.title || group?.name || 'Группа'}`;
        }

        async function refreshGroups() {
            showToast('🔄 Обновление...', 'info');
            for (const g of state.groups) {
                try {
                    const result = await getChat(g.id);
                    if (result.ok) g.title = result.result.title || g.name;
                } catch (e) {}
            }
            saveState();
            updateUI();
            showToast('✅ Обновлено', 'success');
        }

        async function leaveGroup() {
            if (!state.currentGroup) {
                showToast('❌ Выберите группу', 'error');
                return;
            }

            const name = getGroupName(state.currentGroup);
            if (!confirm(`Выйти из "${name}"?`)) return;

            const result = await leaveChat(state.currentGroup);
            if (result.ok) {
                state.groups = state.groups.filter(g => String(g.id) !== state.currentGroup);
                state.messages = state.messages.filter(m => String(m.chatId) !== state.currentGroup);
                state.currentGroup = state.groups.length > 0 ? state.groups[0].id : null;
                state.replyTo = null;
                saveState();
                updateUI();
                renderMessages(state.currentGroup);
                showToast('✅ Вышли из группы', 'success');
            } else {
                showToast('❌ Ошибка', 'error');
            }
        }

        function getGroupName(chatId) {
            const g = state.groups.find(gr => String(gr.id) === chatId);
            return g ? (g.title || g.name || g.id) : chatId;
        }

        // ============================================================
        // ============ ОТВЕТЫ (ЗАЖАТИЕ) ============
        // ============================================================
        let longPressTimer = null;
        let isLongPress = false;

        function setupLongPress(element, messageId) {
            let startTime = 0;

            element.addEventListener('pointerdown', (e) => {
                startTime = Date.now();
                isLongPress = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    setReply(messageId);
                    // Виброотклик если есть
                    if (navigator.vibrate) navigator.vibrate(20);
                }, 400);
            });

            element.addEventListener('pointerup', () => {
                clearTimeout(longPressTimer);
                if (!isLongPress && Date.now() - startTime < 400) {
                    // Просто клик - ничего не делаем
                }
            });

            element.addEventListener('pointerleave', () => {
                clearTimeout(longPressTimer);
            });

            // Touch support
            element.addEventListener('touchstart', (e) => {
                startTime = Date.now();
                isLongPress = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    setReply(messageId);
                    if (navigator.vibrate) navigator.vibrate(20);
                }, 400);
            }, { passive: true });

            element.addEventListener('touchend', () => {
                clearTimeout(longPressTimer);
            }, { passive: true });

            element.addEventListener('touchcancel', () => {
                clearTimeout(longPressTimer);
            }, { passive: true });
        }

        function setReply(messageId) {
            const msg = state.messages.find(m => 
                m.id === messageId && String(m.chatId) === state.currentGroup
            );
            if (!msg || msg.isOutgoing) return;

            state.replyTo = msg;

            const badge = document.getElementById('replyBadge');
            badge.classList.add('show');
            document.getElementById('replyText').textContent = msg.text.substring(0, 60) + (msg.text.length > 60 ? '...' : '');

            // Подсветка
            document.querySelectorAll('.message.incoming').forEach(el => el.classList.remove('selected'));
            const el = document.querySelector(`.message[data-id="${messageId}"]`);
            if (el) el.classList.add('selected');

            showToast('💬 Ответ на сообщение', 'info');
            document.getElementById('messageInput').focus();
        }

        function cancelReply() {
            state.replyTo = null;
            document.getElementById('replyBadge').classList.remove('show');
            document.querySelectorAll('.message.incoming').forEach(el => el.classList.remove('selected'));
        }

        // ============================================================
        // ============ UI ============
        // ============================================================
        function updateUI() {
            // Группы
            const list = document.getElementById('groupsList');
            list.innerHTML = '';

            state.groups.forEach(g => {
                const btn = document.createElement('button');
                const isActive = String(state.currentGroup) === String(g.id);
                btn.className = `group-btn${isActive ? ' active' : ''}`;

                const unread = g.unread > 0 ? `<span class="badge unread">${g.unread}</span>` : '';
                btn.innerHTML = `
                    📱 ${g.title || g.name || g.id.substring(0, 10)}
                    ${unread}
                `;
                btn.onclick = () => selectGroup(g.id);
                list.appendChild(btn);
            });

            // Кнопка добавления
            const addBtn = document.createElement('button');
            addBtn.className = 'group-btn';
            addBtn.innerHTML = '<span class="add-btn">➕</span> Добавить';
            addBtn.onclick = showAddModal;
            list.appendChild(addBtn);

            // Статус
            const input = document.getElementById('messageInput');
            input.disabled = !state.currentGroup;
            input.placeholder = state.currentGroup ? 
                `💬 ${getGroupName(state.currentGroup)}` : 
                'Выберите группу';

            document.getElementById('sendBtn').disabled = !state.currentGroup;
        }

        function renderMessages(chatId) {
            const container = document.getElementById('chatMessages');

            if (!chatId) {
                container.innerHTML = `
                    <div class="chat-empty">
                        <span class="icon">💬</span>
                        Выберите группу
                    </div>
                `;
                return;
            }

            const msgs = state.messages
                .filter(m => String(m.chatId) === chatId)
                .sort((a, b) => (a.date || 0) - (b.date || 0));

            if (msgs.length === 0) {
                container.innerHTML = `
                    <div class="chat-empty">
                        <span class="icon">📭</span>
                        Нет сообщений<br>
                        <span style="font-size: 12px; color: #333;">Напишите первое сообщение</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            msgs.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.isOutgoing ? 'outgoing' : 'incoming'}`;
                div.dataset.id = msg.id;

                // Индикатор ответа
                if (msg.replyToId && msg.replyToText) {
                    const replyDiv = document.createElement('div');
                    replyDiv.className = 'reply-indicator';
                    replyDiv.innerHTML = `
                        <span class="reply-icon">↩️</span>
                        ${msg.replyToText.substring(0, 50)}${msg.replyToText.length > 50 ? '...' : ''}
                    `;
                    div.appendChild(replyDiv);
                }

                // Отправитель (для входящих)
                if (!msg.isOutgoing) {
                    const sender = document.createElement('div');
                    sender.className = 'msg-sender';
                    sender.textContent = msg.from?.username || 'Unknown';
                    div.appendChild(sender);
                }

                // Текст
                const textDiv = document.createElement('div');
                textDiv.className = 'msg-text';
                textDiv.textContent = msg.text || '📎 Медиа';
                div.appendChild(textDiv);

                // Мета
                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                const time = msg.date ? new Date(msg.date * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';
                meta.innerHTML = `
                    <span>${time}</span>
                    ${msg.isOutgoing ? '<span class="check">✅</span>' : ''}
                `;
                div.appendChild(meta);

                // Если входящее - добавляем зажатие для ответа
                if (!msg.isOutgoing) {
                    setupLongPress(div, msg.id);
                    div.title = 'Зажмите для ответа';
                }

                container.appendChild(div);
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function updateStatus(online) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = `status-dot ${online ? 'online' : 'offline'}`;
            text.textContent = online ? 'онлайн' : 'офлайн';
        }

        function clearChat() {
            if (!state.currentGroup) return;
            if (!confirm('Очистить историю?')) return;
            state.messages = state.messages.filter(m => String(m.chatId) !== state.currentGroup);
            renderMessages(state.currentGroup);
            saveState();
            showToast('🗑️ Очищено', 'info');
        }

        // ============================================================
        // ============ ТОСТЫ ============
        // ============================================================
        let toastTimer = null;

        function showToast(text, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.className = `toast ${type} show`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        // ============================================================
        // ============ КЛАВИШИ ============
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cancelReply();
                closeModal();
            }
        });

        // ============================================================
        // ============ ИНИЦИАЛИЗАЦИЯ ============
        // ============================================================
        async function init() {
            loadState();

            // Проверяем бота
            const me = await getMe();
            if (me.ok) {
                botInfo = me.result;
                document.getElementById('botName').textContent = `@${botInfo.username}`;
                startPolling();
            } else {
                showToast('❌ Бот не доступен', 'error');
                updateStatus(false);
            }

            // Если есть группы - выбираем первую
            if (state.groups.length > 0) {
                if (state.currentGroup && state.groups.find(g => String(g.id) === state.currentGroup)) {
                    selectGroup(state.currentGroup);
                } else {
                    selectGroup(state.groups[0].id);
                }
            }

            updateUI();
            renderMessages(state.currentGroup);
            scrollToBottom();

            // Сохраняем при выходе
            window.addEventListener('beforeunload', () => {
                pollingActive = false;
                saveState();
            });

            console.log('🤖 Group Bot Pro v2.0');
            console.log('📱 Бот:', BOT_TOKEN);
            console.log('👤 Ваш ID:', USER_ID);
            console.log('💡 Зажмите сообщение для ответа');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
